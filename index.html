<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#10243A; --ink2:#48607A; --ink3:#8497A8;
  --paper:#FBFBF7; --field:#E7EFE9; --field2:#F2F7F3;
  --rule:#CBD5CE; --rule2:#E4E9E5;
  --stamp:#B0332B; --amber:#946612; --ok:#2F6B4F;
  --pad:clamp(14px,3vw,30px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad) 72px}

header{border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
.kop{max-width:1180px;margin:0 auto;padding:16px var(--pad) 0;display:flex;flex-wrap:wrap;
  gap:16px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(19px,2.5vw,26px);font-weight:700;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.sub b{font-weight:600;color:var(--ink)}
nav{display:flex;gap:2px;margin:14px auto 0;max-width:1180px;padding:0 var(--pad)}
nav button{appearance:none;border:1px solid var(--rule);border-bottom:none;background:transparent;
  font:inherit;font-size:13.5px;font-weight:500;color:var(--ink2);padding:8px 16px;
  border-radius:3px 3px 0 0;cursor:pointer;margin-bottom:-2px}
nav button[aria-selected=true]{background:var(--field);color:var(--ink);font-weight:600;
  border-color:var(--ink);border-bottom:2px solid var(--field)}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  border:1px solid var(--rule);border-top:none;margin-top:26px;background:var(--field2)}
.angka>div{padding:13px 17px;border-right:1px solid var(--rule2)}
.angka>div:last-child{border-right:none}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.angka .val{font-size:clamp(21px,2.8vw,28px);font-weight:600;margin-top:2px;letter-spacing:-.02em}
.angka .val small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}

.blok{margin-top:32px}
.blok .judul{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--ink);padding-bottom:6px}
.blok h2{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.blok .biaya{font-size:13px;color:var(--ink2)}
.blok .biaya b{font-weight:600;color:var(--ink)}
.blok p.ket{margin:7px 0 0;color:var(--ink2);font-size:13px}

.baris{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;
  padding:12px 0;border-top:1px solid var(--rule2)}
.baris:first-of-type{border-top:none}
.kode{font-weight:700}
.nama{color:var(--ink2);font-size:13.5px;margin-left:8px}
.rinci{color:var(--ink3);font-size:12.5px;margin-top:3px}
.nilai{font-size:17px;font-weight:600;white-space:nowrap;text-align:right}
.nilai.tinggi{color:var(--stamp)}
.nilai.kosong{color:var(--ink3);font-weight:400}
.tanda{margin-top:4px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  padding:2px 7px;border-radius:2px;border:1px solid currentColor}
.tag.n{color:var(--stamp)} .tag.u{color:var(--amber)} .tag.d{color:var(--ink3)}

.strip{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.strip i{width:14px;height:18px;border:1px solid var(--rule);border-radius:1px;display:block}
.strip i[data-u="0"],.strip i[data-u="1"]{background:#DCE9E0}
.strip i[data-u="2"],.strip i[data-u="3"]{background:#EBDFC0}
.strip i[data-u="4"],.strip i[data-u="5"]{background:#D9A98D;border-color:#C08A6C}
.strip i[data-u="6"]{background:#C97F6E;border-color:#A85E4E}
.strip .sela{width:5px;border:none;background:transparent}
.legenda{display:flex;gap:14px;align-items:center;color:var(--ink3);font-size:11.5px;
  margin-top:16px;flex-wrap:wrap}
.legenda i{width:11px;height:13px;border:1px solid var(--rule);border-radius:1px;display:block}
.legenda span{display:flex;gap:5px;align-items:center}

.form{margin-top:26px;border:1px solid var(--rule);background:#fff}
.form .kepala{background:var(--field);border-bottom:1px solid var(--rule);padding:12px 16px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.form .isi{padding:16px}
label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  font-weight:600;display:block;margin-bottom:4px}
select,input[type=date],input[type=text]{font:inherit;font-size:14px;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:2px;padding:7px 9px;min-width:120px}
input.num{text-align:right}
select:focus,input:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);
  font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
th.kanan,td.kanan{text-align:right} th.tengah,td.tengah{text-align:center}
td{padding:5px 8px;border-bottom:1px solid var(--rule2)}
td input[type=text]{width:100%;min-width:80px}
tr.grupTgl td{background:var(--field2);font-weight:600;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink2)}
tr.terkunci td{color:var(--ink3);background:var(--field2)}
tr.nihil td input.num{opacity:.35}
button.aksi{font:inherit;font-weight:600;font-size:14px;background:var(--ink);color:var(--paper);
  border:1px solid var(--ink);border-radius:2px;padding:9px 20px;cursor:pointer}
button.aksi:hover{background:#1B3550}
button.aksi[disabled]{opacity:.45;cursor:not-allowed}
button.halus{background:#fff;color:var(--ink);font:inherit;font-size:13px;border:1px solid var(--rule);
  border-radius:2px;padding:7px 13px;cursor:pointer}
.bar{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.pesan{font-size:13px;color:var(--ok);font-weight:500}
.pesan.gagal{color:var(--stamp)}
.kosongan{padding:26px 16px;color:var(--ink2);font-size:14px}
.catatan{margin-top:9px;color:var(--ink3);font-size:12.5px}
.kartuUnit{border:1px solid var(--rule);margin-bottom:14px;background:#fff}
.kartuUnit .atas{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
  align-items:baseline;padding:11px 14px;background:var(--field2);border-bottom:1px solid var(--rule2)}
.kartuUnit .dalam{padding:12px 14px}
.mode{margin-top:26px;padding:10px 14px;border:1px dashed var(--rule);color:var(--ink2);
  font-size:12.5px;background:var(--field2)}
.tombolRinci{font:inherit;font-size:11px;font-weight:600;letter-spacing:.04em;
  background:transparent;color:var(--ink2);border:1px solid var(--rule);border-radius:2px;
  padding:2px 8px;margin-left:8px;cursor:pointer;vertical-align:1px}
.tombolRinci:hover{background:var(--field);border-color:var(--ink2)}
.detail{display:none;padding:2px 0 14px}
.detail.buka{display:block}
tr.detail.buka{display:table-row}
.detail table{font-size:13px}
.detail th{font-size:10px}
.segmen{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.segmen button{font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--ink2);
  border:none;padding:7px 16px;cursor:pointer;min-height:38px}
.segmen button+button{border-left:1px solid var(--rule)}
.segmen button.on{background:var(--ink);color:var(--paper)}
.gulir{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
  body{font-size:14.5px}
  nav{overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:9px 13px}
  .angka{grid-template-columns:1fr 1fr}
  .angka>div{border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);padding:11px 13px}
  .angka .val{font-size:20px}
  .nama{display:block;margin-left:0;margin-top:1px}
  .baris{grid-template-columns:1fr;gap:4px}
  .baris>div:last-child{display:flex;justify-content:space-between;align-items:center;
    border-top:1px dashed var(--rule2);padding-top:6px;margin-top:2px}
  .nilai{text-align:left;font-size:19px}
  .tanda{justify-content:flex-end}
  .form .kepala>div{flex:1 1 140px}
  select,input[type=date],input[type=text]{width:100%;min-width:0;min-height:40px}
  button.aksi{width:100%;min-height:44px}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack thead{display:none}
  table.stack tr{border:1px solid var(--rule);margin-bottom:9px;padding:8px 10px;background:#fff}
  table.stack tr.grupTgl{background:var(--field);border:none;margin:14px 0 6px;padding:5px 10px}
  table.stack td{border:none;padding:4px 0;display:flex;justify-content:space-between;
    align-items:center;gap:12px}
  table.stack td::before{content:attr(data-l);font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink2);font-weight:600}
  table.stack td:first-child::before,table.stack td:nth-child(2)::before{display:none}
  table.stack td:first-child{font-weight:700;font-size:13px;color:var(--ink2)}
  table.stack td:nth-child(2){font-weight:600;border-bottom:1px solid var(--rule2);padding-bottom:6px}
  table.stack td input{max-width:170px;min-height:40px}
  input[type=checkbox]{width:20px;height:20px}
}
@media (max-width:420px){ .angka{grid-template-columns:1fr} }

</style>
</head>
<body>

<div id="gerbang" style="display:flex;min-height:70vh;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center">
  <div style="max-width:420px">
    <h1 style="margin:0 0 6px;letter-spacing:.04em">CPR</h1>
    <p style="color:var(--ink2);font-size:14px;margin:0 0 26px">Masuk dengan akun yang terdaftar.</p>
    <div id="tombolMasuk" style="display:flex;justify-content:center"></div>
    <p id="pesanMasuk" style="color:var(--stamp);font-size:13.5px;margin-top:18px;min-height:20px"></p>
  </div>
</div>

<div id="aplikasi" style="display:none">

<header>
  <div class="kop">
    <div>
      <h1>Cash Position Report</h1>
      <p class="sub" id="subKop">memuat…</p>
    </div>
    <div>
      <label for="tglAcuan">Tanggal acuan</label>
      <input type="date" id="tglAcuan">
    </div>
  </div>
  <nav role="tablist">
    <button role="tab" id="tabAnalisa" aria-selected="false" hidden onclick="pilihTab('analisa')">Summary</button>
    <button role="tab" id="tabPosisi" aria-selected="true" onclick="pilihTab('posisi')">Cash Position</button>
    <button role="tab" id="tabOmset" aria-selected="false" onclick="pilihTab('omset')">Omset</button>
    <button role="tab" id="tabCollect" aria-selected="false" onclick="pilihTab('collect')">Total Collect</button>
    <button role="tab" id="tabExport" aria-selected="false" onclick="pilihTab('export')">Export</button>
    <button role="tab" id="tabVerifikasi" aria-selected="false" hidden onclick="pilihTab('verifikasi')">Verifikasi</button>
  </nav>
</header>

<div class="wrap">
  <section id="panAnalisa" hidden>
    <div class="form">
      <div class="kepala">
        <div><label for="aBulan">Bulan</label>
          <input type="month" id="aBulan" onchange="gambarAnalisa()"></div>
        <div><label for="kUnit">Koreksi unit</label>
          <select id="kUnit" onchange="gambarKoreksiRiwayat()"></select></div>
        <div><label for="kDari">Dari</label><input type="date" id="kDari" onchange="gambarKoreksiRiwayat()"></div>
        <div><label for="kSampai">Sampai</label><input type="date" id="kSampai" onchange="gambarKoreksiRiwayat()"></div>
      </div>
      <div class="isi" id="isiAnalisa"></div>
    </div>
  </section>

  <section id="panPosisi">
    <div class="angka">
      <div><div class="lbl">Outstanding</div><div class="val num" id="aBelum">—</div></div>
      <div><div class="lbl">On Hand</div><div class="val num" id="aDiGC">—</div></div>
      <div><div class="lbl">Aging Tertua</div><div class="val num" id="aUmur">—</div></div>
    </div>
    <div class="bar" style="margin-top:16px">
      <label style="display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;
        font-size:13px;font-weight:500;color:var(--ink2);margin:0">
        <input type="checkbox" id="angkaPenuh" onchange="gambarPosisi()"> Tampilkan angka penuh</label>
      <button class="halus" onclick="salinPosisi(this)">Salin Tabel Posisi</button>
    </div>
    <div id="daftar"></div>
    <div class="legenda">
      <span>Tiap kotak satu hari omset yang belum disetor</span>
      <span><i style="background:#DCE9E0"></i>0–1 hari</span>
      <span><i style="background:#EBDFC0"></i>2–3 hari</span>
      <span><i style="background:#D9A98D"></i>4–5 hari</span>
      <span><i style="background:#C97F6E"></i>&gt; 5 hari</span>
    </div>
  </section>

  <section id="panOmset" hidden>
    <div class="form">
      <div class="kepala">
        <div><label for="oTgl">Tanggal omset</label><input type="date" id="oTgl" onchange="gambarOmset()"></div>
        <div><label>Entitas</label>
          <div class="segmen" id="segOmset">
            <button class="on" data-e="VD" onclick="setEnt('omset','VD')">VD</button>
            <button data-e="TERAS" onclick="setEnt('omset','TERAS')">Teras</button>
          </div></div>
        <div style="flex:1"></div>
        <button class="aksi" onclick="simpanOmset()">Simpan Omset</button>
        <span class="pesan" id="pesanOmset"></span>
      </div>
      <div class="isi" id="isiOmset"></div>
    </div>
  </section>

  <section id="panCollect" hidden>
    <div class="form">
      <div class="kepala">
        <div><label for="cCollect">Tanggal collect</label><input type="date" id="cCollect"></div>
        <div><label for="cSetor">Tanggal setor</label><input type="date" id="cSetor"></div>
        <div><label for="cTambah">Tambah Unit</label>
          <select id="cTambah" onchange="tambahUnit()"></select></div>
        <div><label>Entitas</label>
          <div class="segmen" id="segCollect">
            <button class="on" data-e="VD" onclick="setEnt('collect','VD')">VD</button>
            <button data-e="TERAS" onclick="setEnt('collect','TERAS')">Teras</button>
          </div></div>
      </div>
      <div class="isi" id="isiCollect"></div>
    </div>
  </section>

  <section id="panExport" hidden>
    <div class="form">
      <div class="kepala">
        <div><label for="eUnit">Unit</label><select id="eUnit" onchange="gambarExport()"></select></div>
        <div><label for="eBulan">Bulan</label><input type="month" id="eBulan" onchange="isiPeriode();gambarExport()"></div>
        <div><label for="ePeriode">Period JV</label><input type="text" id="ePeriode" style="min-width:150px"></div>
        <div><label for="eKode">Kode JV</label><input type="text" id="eKode" style="min-width:90px" oninput="pratinjauJV()"></div>
        <div><label>Contoh Nomor</label><div class="num" id="ePratinjau" style="font-weight:600;padding-top:7px">—</div></div>
      </div>
      <div class="isi" id="isiExport"></div>
    </div>
  </section>

  <section id="panVerifikasi" hidden>
    <div class="form">
      <div class="kepala">
        <div><label for="vSaring">Tampilkan</label>
          <select id="vSaring" onchange="gambarVerifikasi()">
            <option value="belum">Belum diverifikasi</option>
            <option value="sudah">Sudah diverifikasi</option>
          </select></div>
        <div><label>Entitas</label>
          <div class="segmen" id="segVerif">
            <button class="on" data-e="" onclick="setEntVerif('')">Semua</button>
            <button data-e="VD" onclick="setEntVerif('VD')">VD</button>
            <button data-e="TERAS" onclick="setEntVerif('TERAS')">Teras</button>
          </div></div>
        <div><label for="vUnit">Unit</label>
          <select id="vUnit" onchange="gambarVerifikasi()"></select></div>
        <div><label for="vDari">Setor dari</label><input type="date" id="vDari" onchange="gambarVerifikasi()"></div>
        <div><label for="vSampai">Sampai</label><input type="date" id="vSampai" onchange="gambarVerifikasi()"></div>
        <div style="flex:1"></div>
        <button class="aksi" onclick="simpanVerifikasi()">Simpan Verifikasi</button>
        <span class="pesan" id="pesanVerif"></span>
      </div>
      <div class="isi" id="isiVerifikasi"></div>
    </div>
  </section>

  <div class="mode" id="mode"></div>
  <div class="bar" style="justify-content:flex-end">
    <span class="rinci" id="siapa"></span>
    <button class="halus" onclick="muatUlang(this)">Muat Ulang Data</button>
    <button class="halus" onclick="keluar()">Keluar</button>
  </div>
</div>
</div>


<script>
/* Data contoh untuk pratinjau saja. Semuanya karangan. Tidak ada nomor
   rekening, kode akun, nama unit, atau nilai omset yang sebenarnya. */
const MASTER_CONTOH=[
 ["UNIT-A","Unit contoh A","A1","Outlet A1","KANTOR","Kantor",1,"VHP_DESKTOP",
  "0000-00001","BANK - 000-000-0001","0000-00002","0000-00003","VD",""],
 ["UNIT-B","Unit contoh B","B1","Outlet B1","JAKARTA","Titik B",1,"PLS",
  "0000-00011","BANK - 000-000-0002","0000-00002","0000-00003","VD",""],
 ["UNIT-B","Unit contoh B","B2","Outlet B2","JAKARTA","Titik B",2,"PLS",
  "0000-00011","BANK - 000-000-0002","0000-00002","0000-00003","VD",""],
 ["UNIT-C","Unit contoh C","C1","Outlet C1","BEKASI","Titik C",1,"VHP_CLOUD",
  "0000-00021","BANK - 000-000-0003","0000-00002","0000-00003","TERAS",""]];
const ZONA_CONTOH=[["KANTOR",0,"Tiap hari"],["JAKARTA",145000,"Sen"],["BEKASI",265000,"Sel"],
                   ["TANGSEL",348000,"Rab"],["BOGOR",508000,"Kam"]];
const CONFIG_CONTOH={SLA_HARI:7,ALERT_NILAI:30000000,BATAS_DATA:3,NAMA_PT:"NAMA PT"};
const DB_CONTOH=[];
const JENIS_CONTOH=[["OMSET","Omset F&B","0000-00002",true],
                    ["DEPOSIT","Advance deposit tamu","0000-00004",false]];
const LAIN_CONTOH=[];

/* ============================================================
   Sambungan ke Apps Script.
   Isi dua nilai ini setelah menerbitkan web app dan membuat
   OAuth Client ID di Google Cloud Console.
   ============================================================ */
const API_URL   = "https://script.google.com/macros/s/AKfycbxfNKv2VdBopCHHKfHQGMvH8ehw8htKMfofdtmoW67aaA_GS6UGEvdLpTh1CHlU3HJc8A/exec";
const CLIENT_ID = "845003258947-ks5b9fejr4506galch549h1kqg0r0jjj.apps.googleusercontent.com";

const modeAPI   = API_URL.indexOf("script.google.com") >= 0;
const adaServer = modeAPI;
let ID_TOKEN = "";
try{ ID_TOKEN = sessionStorage.getItem("cpr_token") || ""; }catch(e){}
let DATA={master:[],zona:[],config:{},db:[]};
async function panggil(fn,arg){
  if(!modeAPI) throw new Error("mode pratinjau");
  if(!ID_TOKEN) throw new Error("Belum masuk.");
  const res=await fetch(API_URL,{method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({aksi:fn,data:arg,idToken:ID_TOKEN})});
  if(!res.ok) throw new Error("Jaringan bermasalah ("+res.status+").");
  const j=await res.json();
  if(!j.ok){
    if(j.galat==="AKSES_DITOLAK"){ tolak("Akun Anda tidak terdaftar, atau sesi sudah berakhir.",true); }
    throw new Error(j.galat||"Gagal.");
  }
  return j.hasil;
}
/* Sekali sudah pernah memberi izin, akun tunggal akan dipilih sendiri
   tanpa klik. Setelah keluar atau ditolak, pilihan otomatis dimatikan
   supaya tidak berputar masuk-keluar. */
let OTOMATIS=true, GSI_INIT=false, GSI_MENUNGGU=false;
function tolak(pesan,matikanOtomatis){
  if(matikanOtomatis){
    OTOMATIS=false;
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  ID_TOKEN=""; sessionStorage.removeItem("cpr_token");

/* Ditandai begitu ada yang mengetik di tab Omset atau Total Collect,
   dan dibersihkan tiap kali tabelnya digambar ulang. Dipakai tombol
   muat ulang untuk memperingatkan sebelum isian tertimpa. */
let KOTOR=false;
document.addEventListener("input",e=>{
  if(e.target.closest&&e.target.closest("#isiOmset,#isiCollect"))KOTOR=true;});
const rp=n=>new Intl.NumberFormat("id-ID").format(Math.round(n||0));
/* Isian angka ditampilkan dengan pemisah ribuan sambil diketik.
   angkaDari membaca kembali nilainya sebagai bilangan. */
const fmtRibu=v=>{const d=String(v==null?"":v).replace(/\D/g,"");
  return d?new Intl.NumberFormat("id-ID").format(+d):"";};
const angkaDari=v=>{const d=String(v==null?"":v).replace(/\D/g,"");return d?+d:0;};
function rapikan(inp){
  const pos=inp.selectionStart==null?String(inp.value).length:inp.selectionStart;
  const digitKiri=String(inp.value).slice(0,pos).replace(/\D/g,"").length;
  inp.value=fmtRibu(inp.value);
  let n=0,i=0;
  while(i<inp.value.length&&n<digitKiri){ if(/\d/.test(inp.value[i]))n++; i++; }
  try{inp.setSelectionRange(i,i);}catch(e){}
}
const penuh=()=>{const e=document.getElementById("angkaPenuh");return e&&e.checked;};
const mio=n=>(n||0)===0?"—":penuh()?new Intl.NumberFormat("id-ID").format(Math.round(n))
  :new Intl.NumberFormat("id-ID",{minimumFractionDigits:1,maximumFractionDigits:1}).format(n/1e6)+" Mio";
const rb=n=>(n||0)===0?"—":new Intl.NumberFormat("id-ID").format(Math.round(n/1000))+" rb";
const HARI=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const BULAN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const tglTeks=s=>{if(!s)return"—";const d=new Date(s+"T00:00:00");return d.getDate()+" "+BULAN[d.getMonth()];};
const beda=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
/* Kalau kolom tanggal dikosongkan, jangan biarkan seluruh halaman mati.
   Kembali ke hari ini dan pulihkan isian kolomnya. */
const hariIni=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);};
function acuan(){
  const e=document.getElementById("tglAcuan");
  const v=e?String(e.value||""):"";
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+"T00:00:00")))return v;
  const t=hariIni(); if(e)e.value=t; return t;
}
const total=r=>(+r.lunch||0)+(+r.dinner||0)+(+r.bfast||0);
const kosong=r=>(r.lunch===""||r.lunch==null)&&(r.dinner===""||r.dinner==null)&&(r.bfast===""||r.bfast==null);
function geser(t,n){
  const d=new Date(t+"T00:00:00");
  if(isNaN(d))return "";
  d.setDate(d.getDate()+n);
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

/* TOTAL_COLLECT milik satu tanggal omset, bukan milik tiap outlet, dan
   ditulis aplikasi hanya di baris outlet pertama. Data yang dimuat dari
   luar aplikasi kadang mengisinya di semua baris, sehingga nilainya
   terhitung berlipat. Duplikat bernilai sama dinetralkan di memori supaya
   seluruh perhitungan benar, tanpa menyentuh sheet. */
let GANDA=0;
function bersihkanGanda(){
  GANDA=0;
  const urut={};
  DATA.master.forEach(m=>{urut[m[0]+"|"+m[2]]=Number(m[6])||1;});
  const g={};
  DATA.db.forEach(r=>{
    if(!r.tglCollect||!(+r.totalCollect>0))return;
    (g[r.unit+"|"+r.tgl]=g[r.unit+"|"+r.tgl]||[]).push(r);});
  Object.keys(g).forEach(k=>{
    const v=g[k];
    if(v.length<2)return;
    if(!v.every(r=>+r.totalCollect===+v[0].totalCollect))return; /* benar-benar terbagi, jangan disentuh */
    v.sort((a,b)=>(urut[a.unit+"|"+a.outlet]||99)-(urut[b.unit+"|"+b.outlet]||99));
    v.slice(1).forEach(r=>{r.totalCollect=0;GANDA++;});
  });
  return GANDA;
}
function unitUnik(){
  const m=new Map();
  DATA.master.forEach(x=>{
    if(!m.has(x[0]))m.set(x[0],{kode:x[0],nama:x[1],zona:x[4],titik:x[5],varian:x[7],
      akunBank:x[8],namaBank:x[9],akunClr:x[10],akunOvr:x[11],
      entitas:(x[12]||"VD").toUpperCase(),hariRotasi:String(x[13]||"").trim(),
      biayaSendiri:+x[14]||0,biayaTambah:+x[15]||0,outlet:[]});
    m.get(x[0]).outlet.push({kode:x[2],nama:x[3],urut:+x[6]||1});});
  const a=[...m.values()]; a.forEach(u=>u.outlet.sort((p,q)=>p.urut-q.urut)); return a;
}
/* Nama hari disamakan ke tiga huruf tanpa tanda baca, jadi Jum, Jumat,
   Jum'at, dan JUMAT sama-sama terbaca. */
const normHari=v=>String(v||"").toLowerCase().replace(/[^a-z]/g,"").slice(0,3);
function cocokHari(daftar,t){
  const d=new Date(t+"T00:00:00"); if(isNaN(d))return false;
  const h=normHari(HARI[d.getDay()]);
  const isi=String(daftar||"");
  if(normHari(isi)==="tia")return true;
  return isi.split(",").map(normHari).indexOf(h)>=0;
}
function zonaHari(t){
  const d=new Date(t+"T00:00:00"); if(isNaN(d))return null;
  const z=DATA.zona.find(x=>x[0]!=="KANTOR"&&normHari(x[2])!=="tia"&&cocokHari(x[2],t));
  return z?z[0]:null;}
function biaya(z){const x=DATA.zona.find(a=>a[0]===z);return x?+x[1]||0:0;}
/* Biaya sekelompok unit dalam sehari. Per zona diambil satu unit termahal
   sebagai jangkar rute, sisanya menyumbang biaya menyisip saja.
   Kalau MASTER_UNIT belum diisi, jatuh ke BIAYA_LOOP per zona. */
function biayaKelompok(arr){
  const z={};
  arr.forEach(x=>{const u=x.u||x; (z[u.zona]=z[u.zona]||[]).push(u);});
  let t=0;
  Object.keys(z).forEach(zona=>{
    const us=z[zona];
    const adaAngka=us.some(u=>u.biayaSendiri>0);
    if(!adaAngka){ t+=biaya(zona); return; }
    let jangkar=us[0];
    us.forEach(u=>{ if((u.biayaSendiri||0)>(jangkar.biayaSendiri||0)) jangkar=u; });
    t+=jangkar.biayaSendiri||0;
    us.forEach(u=>{ if(u!==jangkar) t+=u.biayaTambah||0; });
  });
  return t;
}
/* Jadwal per unit. HARI_ROTASI di MASTER_UNIT menang atas zonanya.
   Kalau kosong, unit ikut jadwal zonanya, dan zona KANTOR tiap hari. */
function unitJadwal(u,t){
  const sendiri=String(u.hariRotasi||"").trim();
  if(sendiri)return cocokHari(sendiri,t);
  if(u.zona==="KANTOR")return true;
  return u.zona===zonaHari(t);
}
/* Hari jadwal terakhir sebelum tanggal acuan. Dipakai untuk menandai unit
   yang seharusnya sudah dijemput tetapi kasnya masih tercatat di unit. */
function rotasiTerakhir(u,t){
  for(let i=1;i<=7;i++){const d=geser(t,-i);if(d&&unitJadwal(u,d))return d;}
  return null;}
function rotasiBerikut(t){
  for(let i=1;i<=7;i++){const d=geser(t,i);if(d&&zonaHari(d))return{tgl:d,zona:zonaHari(d)};}
  return null;}

function status(r){const A=acuan();
  if(r.tgl>=A)return"";
  if(kosong(r))return"BELUM DIISI";
  if(!r.tglCollect||r.tglCollect>=A)return"OUTSTANDING";
  if(!r.tglSetor||r.tglSetor>=A)return"ON HAND";
  return"DISETOR";}

function statusLain(x){
  const A=acuan();
  if(x.tgl>=A)return"";
  if(!x.tglCollect||x.tglCollect>=A)return"OUTSTANDING";
  if(!x.tglSetor||x.tglSetor>=A)return"ON HAND";
  return"DISETOR";
}
const lainUnit=(kode,st)=>(DATA.lain||[]).filter(x=>x.unit===kode&&(!st||statusLain(x)===st));
const namaJenis=k=>{const j=(DATA.jenis||[]).find(a=>a[0]===k);return j?j[1]:k;};

function ringkas(u){
  const A=acuan(),b=DATA.db.filter(r=>r.unit===u.kode);
  const out=b.filter(r=>status(r)==="OUTSTANDING");
  const oh=b.filter(r=>status(r)==="ON HAND");
  const hari=[...new Set(out.map(r=>r.tgl))].sort();
  const terakhir=b.filter(r=>r.tgl<A&&!kosong(r)).map(r=>r.tgl).sort().pop()||null;
  const lOut=lainUnit(u.kode,"OUTSTANDING"), lOh=lainUnit(u.kode,"ON HAND");
  const kasLain=lOut.reduce((s,x)=>s+x.nilai,0);
  const tglLain=lOut.map(x=>x.tgl);
  const semuaTgl=[...new Set(hari.concat(tglLain))].sort();
  return{u,kas:out.reduce((s,r)=>s+total(r),0)+kasLain,
    kasOmset:out.reduce((s,r)=>s+total(r),0),kasLain,lain:lOut,
    onHand:oh.reduce((s,r)=>s+(+r.totalCollect||0),0)+lOh.reduce((s,x)=>s+x.totalCollect,0),
    hari:semuaTgl,
    umur:semuaTgl.length?beda(semuaTgl[0],A):0,terakhir,
    tanpaInput:terakhir?beda(terakhir,A):999};
}

/* ================= CASH POSITION ================= */
function gambarPosisi(){
  const A=acuan(),zHari=zonaHari(A),bes=rotasiBerikut(A);
  const d=new Date(A+"T00:00:00");
  document.getElementById("subKop").innerHTML=
    HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()+
    (zHari?" &nbsp;·&nbsp; rotasi <b>"+zHari+"</b>":" &nbsp;·&nbsp; <b>di luar hari kerja</b>");

  const R=unitUnik().map(ringkas);
  document.getElementById("aBelum").textContent=mio(R.reduce((s,x)=>s+x.kas,0));
  document.getElementById("aDiGC").textContent=mio(R.reduce((s,x)=>s+x.onHand,0));
  const um=Math.max(0,...R.map(x=>x.umur));
  document.getElementById("aUmur").innerHTML=um?um+'<small>hari</small>':"—";

  const AL=+DATA.config.ALERT_NILAI||3e7;
  const rot=R.filter(x=>unitJadwal(x.u,A));
  const sisa=R.filter(x=>!rot.includes(x));
  /* Terlewat: jadwal jemput unit ini sudah lewat, tetapi omset yang paling
     lama masih tercatat sebagai belum dijemput. */
  const lewat=sisa.filter(x=>{
    if(!x.kas||!x.hari.length)return false;
    const t=rotasiTerakhir(x.u,A);
    return !!t && x.hari[0]<=t;});
  const besar=sisa.filter(x=>x.kas>=AL&&!lewat.includes(x));
  const besok=bes?R.filter(x=>unitJadwal(x.u,bes.tgl)&&!besar.includes(x)&&
                              !rot.includes(x)&&!lewat.includes(x)):[];

  const bHari=biayaKelompok(rot), bLewat=biayaKelompok(lewat),
        bBesar=biayaKelompok(besar), bBesok=biayaKelompok(besok);

  let h="";
  h+=blok("Rotasi Hari Ini"+(zHari?" · "+zHari:""),"",bHari,rot,A);
  h+=blok("Belum Ter-collect",
        "Jadwal jemput sudah lewat, kas masih tercatat di unit",bLewat,lewat,A);
  h+=blok("High Value di Luar Rotasi","Di atas "+mio(AL),bBesar,besar,A);
  if(bes) h+=blok("Rotasi Berikutnya · "+bes.zona+" · "+tglTeks(bes.tgl),"",bBesok,besok,A);
  h+='<div class="blok"><div class="judul"><h2>Estimasi Transport Hari Ini'+
     '<button class="tombolRinci" id="tb_biaya" onclick="bukaBiaya()">rincian</button></h2>'+
     '<span class="biaya"><b>'+rb(bHari+bLewat+bBesar)+'</b></span></div>'+
     '<div class="detail" id="dt_biaya">'+tabelBiaya(rot.concat(lewat,besar))+'</div></div>';
  document.getElementById("daftar").innerHTML=h;
}
/* Rincian dari mana angka transport datang: per zona satu unit jadi
   jangkar rute dengan biaya pulang pergi, sisanya biaya menyisip. */
function tabelBiaya(arr){
  if(!arr.length) return '<div class="kosongan">Tidak ada unit yang dijemput hari ini.</div>';
  const z={};
  arr.forEach(x=>{(z[x.u.zona]=z[x.u.zona]||[]).push(x.u);});
  let h='<div class="gulir"><table><thead><tr><th>Zona</th><th>Unit</th><th>Dasar hitung</th>'+
        '<th class="kanan">Biaya</th></tr></thead><tbody>';
  let total=0;
  const baris=(zona,unit,dasar,nilai)=>'<tr><td>'+zona+'</td><td><b>'+unit+'</b></td>'+
    '<td class="rinci">'+dasar+'</td><td class="kanan num">'+nilai+'</td></tr>';
  Object.keys(z).sort().forEach(zona=>{
    const us=z[zona];
    let awal=zona;
    const adaAngka=us.some(u=>(u.biayaSendiri||0)>0);
    if(!adaAngka){
      const b=biaya(zona); total+=b;
      h+=baris(awal,us.map(u=>u.kode).join(", "),
               b?"tarif satu putaran zona":"tanpa ongkos tercatat",b?rp(b):"—");
      return;
    }
    let jangkar=us[0];
    us.forEach(u=>{if((u.biayaSendiri||0)>(jangkar.biayaSendiri||0))jangkar=u;});
    us.slice().sort((a,b)=>(b.biayaSendiri||0)-(a.biayaSendiri||0)).forEach(u=>{
      const jg=u===jangkar, b=jg?(u.biayaSendiri||0):(u.biayaTambah||0);
      total+=b;
      h+=baris(awal,u.kode,jg?"jangkar rute, pulang pergi":
        (b?"menyisip di rute "+zona:"kasnya terkumpul di "+jangkar.kode),b?rp(b):"—");
      awal="";
    });
  });
  h+='<tr style="font-weight:600;background:var(--field2)"><td colspan="3">Total</td>'+
     '<td class="kanan num">'+rp(total)+'</td></tr>';
  return h+'</tbody></table></div>';
}
function bukaBiaya(){
  const d=document.getElementById("dt_biaya"), t=document.getElementById("tb_biaya");
  if(!d)return;
  if(t)t.textContent=d.classList.toggle("buka")?"tutup":"rincian";
}
function blok(judul,ket,biayaTotal,arr,A){
  let h='<div class="blok"><div class="judul"><h2>'+judul+'</h2>'+
        '<span class="biaya">estimasi transport <b>'+rb(biayaTotal)+'</b></span></div>'+
        (ket?'<p class="ket">'+ket+'</p>':'');
  if(!arr.length) return h+'<div class="kosongan">Tidak ada unit di bagian ini.</div></div>';
  arr.sort((a,b)=>b.kas-a.kas);
  const AL=+DATA.config.ALERT_NILAI||3e7, SLA=+DATA.config.SLA_HARI||7, BD=+DATA.config.BATAS_DATA||3;
  arr.forEach(x=>{
    const tinggi=x.kas>AL,tag=[];
    if(tinggi)tag.push('<span class="tag n">high value</span>');
    if(x.umur>SLA)tag.push('<span class="tag u">aging</span>');
    if(x.tanpaInput>BD)tag.push('<span class="tag d">no input</span>');
    let rinci,strip="";
    if(x.hari.length){
      rinci="Omset "+tglTeks(x.hari[0])+"–"+tglTeks(x.hari[x.hari.length-1])+
            " · "+x.hari.length+" hari · aging "+x.umur+" hari";
      let prev=null;
      strip='<div class="strip" aria-hidden="true">'+x.hari.map(t=>{
        const u=Math.min(6,beda(t,A));
        const s=prev&&beda(prev,t)>1?'<i class="sela"></i>':'';prev=t;
        return s+'<i data-u="'+u+'" title="'+tglTeks(t)+'"></i>';}).join("")+'</div>';
    } else rinci=x.terakhir?"Belum ada input sejak "+tglTeks(x.terakhir):"Belum ada input";
    if(x.kasLain>0) rinci+=' · termasuk '+mio(x.kasLain)+' '+
      x.lain.map(l=>namaJenis(l.jenis).toLowerCase()).filter((v,i,a)=>a.indexOf(v)===i).join(", ");
    const bisaBuka=x.hari.length>0;
    h+='<div class="baris">'+
       '<div><span class="kode">'+x.u.kode+'</span>'+
       (bisaBuka?'<button class="tombolRinci" id="tb_'+x.u.kode+'" '+
         'onclick="bukaDetail(\''+x.u.kode+'\')">rincian</button>':'')+
       '<span class="nama">'+x.u.nama+'</span><div class="rinci">'+rinci+'</div>'+strip+'</div>'+
       '<div><div class="nilai '+(tinggi?"tinggi":(x.kas?"":"kosong"))+'">'+mio(x.kas)+'</div>'+
       (x.onHand?'<div class="rinci" style="text-align:right">on hand '+mio(x.onHand)+'</div>':'')+
       (tag.length?'<div class="tanda">'+tag.join("")+'</div>':'')+'</div></div>';
    if(bisaBuka) h+='<div class="detail" id="dt_'+x.u.kode+'">'+tabelDetail(x)+'</div>';
  });
  return h+'</div>';
}

function salinPosisi(t){
  const A=acuan();
  const aoa=[["Unit","Nama","Entitas","Zona","Outstanding","On hand","Hari omset",
              "Aging hari","Omset dari","Omset sampai","Input terakhir"]];
  unitUnik().map(ringkas).sort((a,b)=>b.kas-a.kas).forEach(x=>{
    aoa.push([x.u.kode,x.u.nama,x.u.entitas,x.u.zona,x.kas,x.onHand,x.hari.length,
              x.umur,x.hari[0]||"",x.hari[x.hari.length-1]||"",x.terakhir||""]);
  });
  salin(aoa,t);
}

function tabelDetail(x){
  const A=acuan(), u=x.u;
  const banyak=u.outlet.length>1;
  let h='<div class="gulir"><table><thead><tr><th>Tanggal</th>'+
        (banyak?'<th>Outlet</th>':'')+
        '<th class="kanan">Lunch</th><th class="kanan">Dinner</th>'+
        '<th class="kanan">Breakfast</th><th class="kanan">Total</th>'+
        '<th class="kanan">Aging</th></tr></thead><tbody>';
  let tl=0,td=0,tb=0,tt=0;
  x.hari.forEach(t=>{
    const rows=DATA.db.filter(r=>r.unit===u.kode&&r.tgl===t&&status(r)==="OUTSTANDING");

function isiBarisOmset(r,namaOutlet,tgl,kodeUnit){
  const id=r.tgl+"|"+r.unit+"|"+r.outlet;
  const kunci=!!r.tglCollect;
  const nihil=!kosong(r)&&total(r)===0;
  return '<tr class="'+(kunci?"terkunci":"")+(nihil?" nihil":"")+'" data-id="'+id+'">'+
    (kodeUnit?'<td>'+kodeUnit+'</td>':'<td>'+r.unit+'</td>')+
    '<td>'+namaOutlet+'</td>'+
    ['lunch','dinner','bfast'].map(f=>
      '<td class="kanan" data-l="'+(f==="bfast"?"breakfast":f)+'"><input class="num" inputmode="numeric" data-id="'+id+'" data-f="'+f+
      '" value="'+((r[f]===0||r[f])?fmtRibu(r[f]):"")+'"'+(kunci?" disabled":"")+
      ' oninput="rapikan(this);lepasNihil(this)"></td>').join("")+
    '<td class="tengah" data-l="Tidak ada omset"><input type="checkbox" data-nihil="'+id+'"'+(nihil?" checked":"")+

function setNihil(cb){
  const id=cb.dataset.nihil;
  document.querySelectorAll('input[data-id="'+id+'"]').forEach(i=>{
    i.value=cb.checked?"0":""; });
  document.querySelector('tr[data-id="'+id+'"]').classList.toggle("nihil",cb.checked);
}
function lepasNihil(inp){
  const cb=document.querySelector('[data-nihil="'+inp.dataset.id+'"]');
  if(cb&&cb.checked&&angkaDari(inp.value)>0){cb.checked=false;
    document.querySelector('tr[data-id="'+inp.dataset.id+'"]').classList.remove("nihil");}

async function simpanOmset(){
  const p=document.getElementById("pesanOmset");
  const per={};
  document.querySelectorAll("#isiOmset input[data-f]").forEach(i=>{
    per[i.dataset.id]=per[i.dataset.id]||{};
    per[i.dataset.id][i.dataset.f]=String(i.value).trim()===""?"":angkaDari(i.value);});
  const baris=Object.keys(per).map(k=>{const[tgl,unit,outlet]=k.split("|");
    return{tgl,unit,outlet,...per[k]};})
    .filter(b=>b.lunch!==""||b.dinner!==""||b.bfast!=="");
  if(!baris.length){p.className="pesan gagal";p.textContent="Belum ada yang diisi.";return;}
  try{
    let hasil=null;
    if(adaServer) hasil=await panggil("simpanOmset",baris);
    /* Server melaporkan baris mana yang dilewati karena sudah dijemput.
       Baris itu tidak ikut diperbarui di layar, sisanya tetap masuk. */
    const tolak=new Set((hasil&&hasil.ditolak)||[]);
    baris.filter(b=>!tolak.has(b.tgl+"|"+b.unit+"|"+b.outlet)).forEach(b=>{
      const i=DATA.db.findIndex(x=>x.unit===b.unit&&x.outlet===b.outlet&&x.tgl===b.tgl);
      if(i>=0)Object.assign(DATA.db[i],b);else DATA.db.push({...b,tglCollect:"",tglSetor:"",totalCollect:0});});
    const masuk=baris.length-tolak.size;
    if(tolak.size){
      p.className="pesan gagal";
      p.textContent=masuk+" baris tersimpan, "+tolak.size+" dilewati karena sudah dijemput.";
    }else{
      p.className="pesan";
      p.textContent=(adaServer?"Tersimpan. ":"Tersimpan sementara. ")+masuk+" baris.";
    }
    gambarOmset(); gambarPosisi();
  }catch(e){p.className="pesan gagal";p.textContent="Gagal menyimpan. "+e.message;}
}

function hitungCollect(kode){
  let terima=0,sistem=0;
  document.querySelectorAll('[data-ul="'+kode+'"]').forEach(cb=>{
    if(cb.checked){
      const i=document.querySelector('[data-terimal="'+cb.dataset.id+'"]');
      const l=(DATA.lain||[]).find(x=>x.id===cb.dataset.id);
      terima+=angkaDari(i.value); sistem+=l?l.nilai:0;
    }});
  (LAIN_BARU[kode]||[]).forEach(b=>{terima+=b.nilai;sistem+=b.nilai;});
  document.querySelectorAll('[data-terima^="'+kode+'|"]').forEach(i=>{
    const t=i.dataset.terima.split("|")[1];
    const cb=document.querySelector('[data-u="'+kode+'"][data-t="'+t+'"]');
    if(cb&&cb.checked){terima+=angkaDari(i.value);
      sistem+=DATA.db.filter(r=>r.unit===kode&&r.tgl===t&&status(r)==="OUTSTANDING")
                     .reduce((s,r)=>s+total(r),0);}});
  const a=document.getElementById("tot_"+kode),b=document.getElementById("sel_"+kode);
  if(!a)return; a.textContent=rp(terima);
  const s=terima-sistem; b.textContent=(s>0?"+":"")+rp(s);
  b.style.color=s<0?"var(--stamp)":(s>0?"var(--amber)":"var(--ok)");
}

  const cat=(document.querySelector('[data-catatan="'+kode+'"]')||{}).value||"";
  const pilih=[];
  document.querySelectorAll('[data-u="'+kode+'"]').forEach(cb=>{
    if(cb.checked){const t=cb.dataset.t;
      const i=document.querySelector('[data-terima="'+kode+"|"+t+'"]');
      pilih.push({tgl:t,terima:angkaDari(i.value)});}});
  const pilihLain=[];
  document.querySelectorAll('[data-ul="'+kode+'"]').forEach(cb=>{
    if(cb.checked){const i=document.querySelector('[data-terimal="'+cb.dataset.id+'"]');
      pilihLain.push({id:cb.dataset.id,terima:angkaDari(i.value)});}});
  const lainBaru=LAIN_BARU[kode]||[];

  try{
    if(adaServer)await panggil("simpanCollect",{unit:kode,tglCollect:c,tglSetor:s,catatan:cat,
                                               baris:pilih,lain:pilihLain,lainBaru:lainBaru});
    pilih.forEach(x=>{const rs=DATA.db.filter(r=>r.unit===kode&&r.tgl===x.tgl);
      rs.forEach((r,i)=>{r.tglCollect=c;r.tglSetor=s||"";r.totalCollect=i===0?x.terima:0;
                         r.catatan=i===0?cat:"";});});
    pilihLain.forEach(x=>{const l=DATA.lain.find(y=>y.id===x.id);
      if(l){l.tglCollect=c;l.tglSetor=s||"";l.totalCollect=x.terima;l.catatan=cat;}});
    lainBaru.forEach((b,i)=>DATA.lain.push({id:"TL-LOKAL-"+Date.now()+"-"+i,tgl:c,unit:kode,
      jenis:b.jenis,nilai:b.nilai,referensi:b.referensi,
      tglCollect:c,tglSetor:s||"",totalCollect:b.nilai,catatan:cat}));
    LAIN_BARU[kode]=[];
    p.className="pesan";p.textContent=adaServer?"Tersimpan.":"Tersimpan sementara.";

/* ---------- koreksi collect yang sudah tersimpan ---------- */
function peristiwaCollect(){
  const ent=new Set(unitEnt("collect").map(u=>u.kode));
  const m={};
  DATA.db.filter(r=>r.tglCollect&&ent.has(r.unit)).forEach(r=>{
    const k=r.unit+"|"+r.tglCollect;
    m[k]=m[k]||{unit:r.unit,tglCollect:r.tglCollect,tglSetor:r.tglSetor||"",nilai:0,tgl:new Set()};
    m[k].nilai+=+r.totalCollect||0; m[k].tgl.add(r.tgl);
  });
  (DATA.lain||[]).filter(x=>x.tglCollect&&ent.has(x.unit)).forEach(x=>{
    const k=x.unit+"|"+x.tglCollect;
    m[k]=m[k]||{unit:x.unit,tglCollect:x.tglCollect,tglSetor:x.tglSetor||"",nilai:0,tgl:new Set()};
    m[k].nilai+=+x.totalCollect||0;
  });
  return Object.keys(m).map(k=>({kunci:k,...m[k]}))
    .sort((a,b)=>b.tglCollect.localeCompare(a.tglCollect)).slice(0,40);
}
function blokKoreksi(){
  const p=peristiwaCollect();
  let h='<div class="blok"><div class="judul"><h2>Koreksi Collect</h2></div>';
  if(!p.length) return h+'<div class="kosongan">Belum ada collect tersimpan.</div></div>';
  h+='<div class="bar"><div style="min-width:260px;flex:1"><label for="kPilih">Peristiwa collect</label>'+
     '<select id="kPilih" onchange="gambarKoreksi()"><option value="">— pilih —</option>'+
     p.map(x=>'<option value="'+x.kunci+'">'+x.unit+' · jemput '+tglTeks(x.tglCollect)+
       ' · '+rp(x.nilai)+(x.tglSetor?' · sudah disetor '+tglTeks(x.tglSetor):' · belum disetor')+
       '</option>').join("")+'</select></div></div>';
  h+='<div id="isiKoreksi"></div></div>';
  return h;
}

    h+='<tr><td>'+tglTeks(x.tgl)+' <span class="rinci">'+namaJenis(x.jenis)+' · '+x.referensi+
       '</span></td><td class="kanan num">'+rp(x.nilai)+'</td>'+
       '<td class="kanan"><input class="num" inputmode="numeric" data-korl="'+x.id+
       '" value="'+fmtRibu(x.totalCollect)+'" oninput="rapikan(this)"'+
       (sudah&&!adm?" disabled":"")+'></td></tr>';
  });
  h+='</tbody></table></div>';
  const tglS=(rows[0]&&rows[0].tglSetor)||(lain[0]&&lain[0].tglSetor)||"";
  h+='<div class="bar" style="align-items:flex-end">'+
     '<div><label>Tanggal setor</label><input type="date" id="kSetor" value="'+tglS+'"'+
       (sudah&&!adm?" disabled":"")+'></div>'+
     '<div style="flex:2;min-width:220px"><label>Alasan koreksi (wajib)</label>'+
       '<input type="text" id="kAlasan" placeholder="mis. slip bank berbeda, uang kurang saat dihitung ulang"'+
       (sudah&&!adm?" disabled":"")+'></div>'+
     '<button class="aksi" onclick="simpanKoreksi()"'+(sudah&&!adm?" disabled":"")+'>Simpan koreksi</button>'+
     '<span class="pesan" id="pesanKoreksi"></span></div>';
  const sebab=verif?"Sudah diverifikasi":"Sudah disetor";
  if(sudah&&!adm) h+='<p class="catatan">'+sebab+'. Hanya admin yang bisa memperbaiki.</p>';
  else if(sudah) h+='<p class="catatan">'+sebab+'. Perubahan tercatat beserta alasannya.</p>';
  box.innerHTML=h;
}
async function simpanKoreksi(){
  const k=document.getElementById("kPilih").value;
  const p=document.getElementById("pesanKoreksi");
  if(!k)return;
  const [unit,tglC]=k.split("|");
  const alasan=(document.getElementById("kAlasan").value||"").trim();
  if(!alasan){p.className="pesan gagal";p.textContent="Alasan koreksi wajib diisi.";return;}
  const baris=[],lain=[];
  document.querySelectorAll("#isiKoreksi [data-kor]").forEach(i=>
    baris.push({tgl:i.dataset.kor,terima:angkaDari(i.value)}));
  document.querySelectorAll("#isiKoreksi [data-korl]").forEach(i=>
    lain.push({id:i.dataset.korl,terima:angkaDari(i.value)}));
  const tglSetor=document.getElementById("kSetor").value||"";
  try{
    if(adaServer) await panggil("koreksiCollect",{unit,tglCollect:tglC,tglSetor,alasan,baris,lain});
    baris.forEach(b=>DATA.db.filter(r=>r.unit===unit&&r.tgl===b.tgl&&r.tglCollect===tglC)
      .forEach((r,i)=>{if(i===0)r.totalCollect=b.terima; r.tglSetor=tglSetor;}));
    lain.forEach(x=>{const l=DATA.lain.find(y=>y.id===x.id);
      if(l){l.totalCollect=x.terima;l.tglSetor=tglSetor;}});
    p.className="pesan";p.textContent=adaServer?"Koreksi tersimpan.":"Tersimpan sementara.";
    gambarCollect();gambarPosisi();
  }catch(e){p.className="pesan gagal";p.textContent="Gagal. "+e.message;}
}

/* ================= EXPORT =================
   JV  : .xls, tata letak direplikasi persis dari berkas VHP.
         Semua isi mulai kolom B. Baris 11 sengaja dikosongkan.
   RPT : .xlsx lewat ExcelJS, karena SheetJS versi gratis tidak bisa
         menulis warna, garis, maupun formula ke .xls.
   Satu berkas untuk satu tanggal setor.
   ========================================================= */
const BULAN_PANJANG=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI",
                     "AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const BULAN_PENDEK=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

const FMT_AKUN='_-* #,##0_-;\\-* #,##0_-;_-* "-"_-;_-@_-';
const FMT_RP='"Rp"#,##0';
const FMT_TGL_DESKTOP='dd\\-mm\\-yy';
const FMT_TGL_CLOUD='mm/dd/yyyy';
const FMT_TGL_BARIS='dd-mmm-yyyy';
const FMT_TGL_SETOR='[$-C09]dd-mmm-yy;@';
/* [$-F800] menyerahkan bentuknya ke setelan tanggal panjang sistem, jadi
   isinya berubah antar komputer dan teks sisipan diabaikan. Bentuknya
   ditulis tegas supaya sama di mana pun berkas dibuka. */
const FMT_TGL_PANJANG='[$-409]dd mmmm yyyy';
const BIRU="FF1F4E78", KUNING="FFFFF2CC";
/* Titik dua ditempel di awal kolom B lewat format angka, supaya semua
   titik dua berdiri di satu garis lurus tanpa perlu kolom tambahan. */
const PRE_TITIK='": "';
/* Kode wilayah seperti [$-F800] harus tetap berada paling depan, jadi
   awalan titik dua disisipkan sesudahnya, bukan sebelumnya. */
const tempelTitik=z=>{const m=String(z).match(/^(\[[^\]]*\])([\s\S]*)$/);
  return m?m[1]+PRE_TITIK+m[2]:PRE_TITIK+z;};
const GARIS={top:{style:"thin"},left:{style:"thin"},bottom:{style:"thin"},right:{style:"thin"}};

const KOL=i=>{let s="",n=i;do{s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)-1;}while(n>=0);return s;};
const serialTgl=t=>Math.round(new Date(t+"T00:00:00Z").getTime()/864e5)+25569;
const tglUTC=t=>new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)));
const fmtID=t=>{const d=tglUTC(t);
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear();};
const fmtPendek=t=>{const d=tglUTC(t);
  return d.getUTCDate()+" "+BULAN_PENDEK[d.getUTCMonth()]+" "+d.getUTCFullYear();};

/* Kode JV diturunkan dari bulan yang dipilih: dua digit bulan diikuti dua
   digit tahun. Urutan tiga digit mengikuti posisi tanggal setor di dalam
   bulan itu, jadi setoran yang diinput mundur akan menggeser nomor
   sesudahnya. Nomor tiap tanggal ditampilkan di tabel sebelum diunduh. */
function kodeDari(bulan){ return bulan.slice(5,7)+bulan.slice(2,4); }
function periodeDari(bulan){ return BULAN_PANJANG[+bulan.slice(5,7)-1]+"-"+bulan.slice(0,4); }
function isiPeriode(){
  const b=document.getElementById("eBulan").value;
  if(!/^\d{4}-\d{2}$/.test(b))return;
  document.getElementById("ePeriode").value=periodeDari(b);
  document.getElementById("eKode").value=kodeDari(b);
  pratinjauJV();
}
function pratinjauJV(){
  const k=document.getElementById("eKode").value.trim();
  const el=document.getElementById("ePratinjau");
  if(el)el.textContent=k?"BK-GC"+k+"-001":"—";
  if(!document.getElementById("panExport").hidden)gambarExport();
}
function tglSetorBulan(kode,bulan){
  const a=DATA.db.filter(r=>r.unit===kode&&r.tglSetor&&r.tglSetor.slice(0,7)===bulan).map(r=>r.tglSetor);
  const b=(DATA.lain||[]).filter(x=>x.unit===kode&&x.tglSetor&&x.tglSetor.slice(0,7)===bulan).map(x=>x.tglSetor);
  return [...new Set(a.concat(b))].sort();
}
function nomorJV(kode,bulan,t){
  const kodeJV=(document.getElementById("eKode").value||kodeDari(bulan)).trim();
  const idx=tglSetorBulan(kode,bulan).indexOf(t);
  return "BK-GC"+kodeJV+"-"+String(idx+1).padStart(3,"0");
}

/* Merangkai data satu tanggal setor: per tanggal omset, per outlet,
   urut mengikuti URUT_OUTLET di MASTER_UNIT. */
function dataSetor(kode,t){
  const u=unitUnik().find(x=>x.kode===kode);
  const rows=DATA.db.filter(r=>r.unit===kode&&r.tglSetor===t);
  const tgl=[...new Set(rows.map(r=>r.tgl))].sort();
  const hari=tgl.map(d=>{
    const rr=rows.filter(r=>r.tgl===d);
    return {tgl:d,
      terima:rr.reduce((s,r)=>s+(+r.totalCollect||0),0),
      per:u.outlet.map(o=>{
        const r=rr.find(x=>x.outlet===o.kode)||{};
        return {label:o.kode, bfast:+r.bfast||0, lunch:+r.lunch||0, dinner:+r.dinner||0,
                nilai:(+r.bfast||0)+(+r.lunch||0)+(+r.dinner||0)};})};
  });
  const lain=(DATA.lain||[]).filter(x=>x.unit===kode&&x.tglSetor===t).map(x=>{
    const j=(DATA.jenis||[]).find(a=>a[0]===x.jenis)||[];
    return {tgl:x.tgl, nama:j[1]||"Advance deposit", akun:j[2]||"",
            nilai:+x.totalCollect||0, referensi:x.referensi||""};});
  return {u,hari,lain};
}

function gambarExport(){
  const kode=document.getElementById("eUnit").value,bulan=document.getElementById("eBulan").value;
  if(!document.getElementById("eKode").value)isiPeriode();
  const tgl=tglSetorBulan(kode,bulan);
  if(!tgl.length){document.getElementById("isiExport").innerHTML=
    '<div class="kosongan">Belum ada setoran untuk unit dan bulan itu.</div>';return;}
  let h='<div class="gulir"><table><thead><tr><th>Tanggal setor</th><th>Nomor JV</th>'+
        '<th class="kanan">Omset</th><th class="kanan">Deposit</th>'+
        '<th class="kanan">Hari omset</th><th>Berkas</th></tr></thead><tbody>';
  tgl.forEach(t=>{
    const d=dataSetor(kode,t);
    const omset=d.hari.reduce((s,x)=>s+x.terima,0);
    const dep=d.lain.reduce((s,x)=>s+x.nilai,0);
    h+='<tr><td>'+tglTeks(t)+'</td><td class="num">'+nomorJV(kode,bulan,t)+'</td>'+
       '<td class="kanan num">'+rp(omset)+'</td>'+
       '<td class="kanan num">'+(dep?rp(dep):"—")+'</td>'+
       '<td class="kanan num">'+d.hari.length+'</td>'+
       '<td><button class="halus" onclick="unduhJV(\''+kode+'\',\''+t+'\')">JV .xls</button> '+
       '<button class="halus" onclick="unduhReport(\''+kode+'\',\''+t+'\')">Report .xlsx</button></td></tr>';
  });
  h+='</tbody></table></div><div class="bar"><span class="pesan" id="pesanExport"></span></div>';
  const belum=tgl.filter(t=>DATA.db.some(r=>r.unit===kode&&r.tglSetor===t&&!r.verifOleh));
  if(belum.length)
    h+='<p class="catatan" style="color:var(--stamp)">'+belum.length+
       ' tanggal setor belum diverifikasi Income Auditor.</p>';
  document.getElementById("isiExport").innerHTML=h;

function pesanEx(teks,gagal){
  const p=document.getElementById("pesanExport");
  if(p){p.className="pesan"+(gagal?" gagal":"");p.textContent=teks;}
}

/* ---------- JV .xls ---------- */
function barisJurnal(u,hari,lain){
  const banyak=u.outlet.length>1, out=[];
  hari.forEach(h=>{
    const sistem=h.per.reduce((s,p)=>s+p.nilai,0);
    const vr=h.terima-sistem;
    const rmk="CASH SALES "+u.kode+" "+fmtID(h.tgl);
    out.push({desc:u.namaBank,akun:u.akunBank,debit:h.terima,kredit:"",remark:rmk});
    h.per.forEach(p=>out.push({desc:"CASH SALES CLEAREANCE",akun:u.akunClr,debit:"",kredit:p.nilai,
      remark:banyak?"CASH SALES "+p.label+" "+u.kode+" "+fmtID(h.tgl):rmk}));
    if(vr!==0)out.push({desc:"OVERAGES/SHORTAGES",akun:u.akunOvr,
      debit:vr<0?Math.abs(vr):"",kredit:vr>0?vr:"",remark:rmk});
  });
  (lain||[]).forEach(x=>{
    const rmk=x.nama.toUpperCase()+" "+u.kode+" "+fmtID(x.tgl)+" - "+x.referensi;
    out.push({desc:u.namaBank,akun:u.akunBank,debit:x.nilai,kredit:"",remark:rmk});
    out.push({desc:x.nama.toUpperCase(),akun:x.akun,debit:"",kredit:x.nilai,remark:rmk});
  });
  return out;
}
function unduhJV(kode,t){
  const bulan=document.getElementById("eBulan").value;
  const {u,hari,lain}=dataSetor(kode,t);
  if(!hari.length&&!lain.length){pesanEx("Tidak ada data untuk tanggal itu.",1);return;}
  const periode=(document.getElementById("ePeriode").value||periodeDari(bulan)).trim();
  const noJV=nomorJV(kode,bulan,t);
  const cloud=u.varian==="VHP_CLOUD";
  const ws={};
  const S=(a,v)=>{ws[a]={t:"s",v:String(v)};};
  const N=(a,v,z)=>{ws[a]={t:"n",v:Number(v)};if(z)ws[a].z=z;};

  if(cloud){
    S("B2","Version 1.0.0");
    S("B3",u.kode+"\nJOURNAL VOUCHER");
    S("B6",periode); S("C6",periode);
    S("E6","Journal Date"); N("F6",serialTgl(t),FMT_TGL_CLOUD);
    S("B7",noJV); S("C7",noJV);
    S("B8","CASH SALES "+u.kode); S("C8","CASH SALES "+u.kode);
    ["Account","Description","Debit","Credit","Remarks"].forEach((x,i)=>S(KOL(1+i)+"10",x));
  }else{
    S("B4","JOURNAL VOUCHER");
    S("B6","Period     : "+periode);
    S("E6","Journal Date"); N("F6",serialTgl(t),FMT_TGL_DESKTOP);
    S("B7","No. JV     : "+noJV);
    S("B8","Name JV : CASH SALES "+u.kode);
    ["Description","Account","Debit","Credit","Remarks"].forEach((x,i)=>S(KOL(1+i)+"10",x));
  }
  let r=12,tDeb=0,tKre=0;
  barisJurnal(u,hari,lain).forEach(b=>{
    if(cloud){S("B"+r,b.akun);S("C"+r,b.desc);}else{S("B"+r,b.desc);S("C"+r,b.akun);}
    if(b.debit!==""){N("D"+r,b.debit,FMT_AKUN);tDeb+=+b.debit;}
    if(b.kredit!==""){N("E"+r,b.kredit,FMT_AKUN);tKre+=+b.kredit;}
    S("F"+r,b.remark); r++;
  });
  S("C"+r,"TOTAL"); N("D"+r,tDeb,FMT_AKUN); N("E"+r,tKre,FMT_AKUN);
  S("C"+(r+1),"Selisih (harus 0)"); N("E"+(r+1),tKre-tDeb,FMT_AKUN);
  ws["!ref"]="A1:F"+(r+1);
  ws["!merges"]=[cloud?{s:{r:2,c:1},e:{r:2,c:5}}:{s:{r:3,c:1},e:{r:3,c:5}}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,String(tglUTC(t).getUTCDate()));
  XLSX.writeFile(wb,"JV_"+kode+"_"+t.replace(/-/g,"")+".xls",{bookType:"xls"});
  pesanEx("JV "+noJV+" dibuat"+(tKre!==tDeb?" — PERHATIAN, debit dan kredit tidak seimbang.":"."),tKre!==tDeb);
}

/* ---------- Report .xlsx ---------- */
let EXCELJS_SIAP=null;
function muatExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  if(EXCELJS_SIAP)return EXCELJS_SIAP;
  const sumber=["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",
                "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
  EXCELJS_SIAP=new Promise((ok,gagal)=>{
    let i=0;
    const coba=()=>{
      if(i>=sumber.length){gagal(new Error("Pustaka Excel tidak bisa dimuat."));return;}
      const s=document.createElement("script");
      s.src=sumber[i++]; s.onload=()=>ok(); s.onerror=coba;
      document.head.appendChild(s);
    };
    coba();
  });
  return EXCELJS_SIAP;
}
async function unduhReport(kode,t){
  const {u,hari,lain}=dataSetor(kode,t);
  if(!hari.length&&!lain.length){pesanEx("Tidak ada data untuk tanggal itu.",1);return;}
  pesanEx("Menyiapkan Report…");
  try{ await muatExcelJS(); }
  catch(e){ pesanEx("Gagal memuat pustaka Excel. Periksa sambungan internet.",1); return; }

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Report");
  const nOut=u.outlet.length, multi=nOut>1;
  const cShift=1+(multi?0:1), cNet=cShift+3*nOut, cRem=cNet+1, cOvr=cNet+2, cAkhir=cOvr;
  const set=(a,v,o)=>{
    const c=ws.getCell(a); c.value=v; o=o||{};
    if(o.z)c.numFmt=o.z;
    if(o.b)c.font=Object.assign({bold:true},o.font||{}); else if(o.font)c.font=o.font;
    if(o.fill)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:o.fill}};
    if(o.garis)c.border=GARIS;
    if(o.rata)c.alignment={horizontal:o.rata,vertical:"middle",wrapText:!!o.wrap};
    return c;
  };
  for(let c=0;c<=cAkhir;c++){
    const cell=ws.getCell(KOL(c)+"2");
    cell.alignment={horizontal:"centerContinuous"}; cell.font={bold:true,size:12};
  }
  ws.getCell("A2").value="GENERAL CASHIER'S DAILY REMITTANCE & CASH DEPOSIT REPORT";
  set("A4","A. CASH REMITTANCE",{b:1});
  set(KOL(cAkhir-1)+"4","Tgl Setor :",{b:1,rata:"right"});
  set(KOL(cAkhir)+"4",tglUTC(t),{z:FMT_TGL_SETOR});
  set("A5","Omset tgl :",{font:{italic:true,size:9}});
  set("B5",hari.map(x=>fmtPendek(x.tgl)).join(", "),{font:{italic:true,size:9}});
  ws.mergeCells("B5:"+KOL(cAkhir-2)+"5");

  const kepala={fill:BIRU,font:{bold:true,color:{argb:"FFFFFFFF"},size:9},garis:1,rata:"center",wrap:true};
  set("A7","DATE",kepala); ws.mergeCells("A7:A8");
  if(multi){
    u.outlet.forEach((o,i)=>{
      const c0=cShift+3*i;
      set(KOL(c0)+"7",o.kode,kepala);
      ws.mergeCells(KOL(c0)+"7:"+KOL(c0+2)+"7");
      ["Breakfast","Lunch","Dinner"].forEach((s,j)=>set(KOL(c0+j)+"8",s,kepala));
    });
  }else{
    set("B7","OUTLET",kepala); ws.mergeCells("B7:B8");
    set(KOL(cShift)+"7","OUTLET CASHIER SHIFT",kepala);
    ws.mergeCells(KOL(cShift)+"7:"+KOL(cShift+2)+"7");
    ["Breakfast","Lunch","Dinner"].forEach((s,j)=>set(KOL(cShift+j)+"8",s,kepala));
  }
  [[cNet,"NET CASH"],[cRem,"AMOUNT REMITTED TO GC"],[cOvr,"(SHORT) OVERAGE"]].forEach(x=>{
    set(KOL(x[0])+"7",x[1],kepala); ws.mergeCells(KOL(x[0])+"7:"+KOL(x[0])+"8");
  });

  /* Formula disertai nilai hasilnya, supaya angka sudah terbaca sebelum
     Excel sempat menghitung ulang. */
  const r0=9, mat=[];
  hari.forEach((h,i)=>{
    const r=r0+i, baris={};
    let net=0;
    set("A"+r,tglUTC(h.tgl),{z:FMT_TGL_BARIS,garis:1});
    if(!multi)set("B"+r,u.kode,{garis:1});
    u.outlet.forEach((o,k)=>{
      const p=h.per[k]||{}, c0=cShift+3*k;
      [+p.bfast||0,+p.lunch||0,+p.dinner||0].forEach((v,j)=>{
        set(KOL(c0+j)+r,v,{z:FMT_AKUN,garis:1}); baris[c0+j]=v; net+=v;});
    });
    baris[cNet]=net; baris[cRem]=h.terima; baris[cOvr]=h.terima-net;
    set(KOL(cNet)+r,{formula:"SUM("+KOL(cShift)+r+":"+KOL(cNet-1)+r+")",result:net},
        {z:FMT_AKUN,garis:1});
    set(KOL(cRem)+r,h.terima,{z:FMT_AKUN,garis:1});
    set(KOL(cOvr)+r,{formula:KOL(cRem)+r+"-"+KOL(cNet)+r,result:h.terima-net},
        {z:FMT_AKUN,garis:1});
    mat.push(baris);
  });

  const rT=r0+hari.length, total={b:1,fill:KUNING,garis:1};
  set("A"+rT,"TOTAL",total);
  if(!multi)set("B"+rT,"",total);
  for(let c=cShift;c<=cOvr;c++)
    set(KOL(c)+rT,{formula:"SUM("+KOL(c)+r0+":"+KOL(c)+(rT-1)+")",
                   result:mat.reduce((a,b)=>a+(b[c]||0),0)},Object.assign({z:FMT_AKUN},total));

  const totOmset=hari.reduce((s,x)=>s+x.terima,0);
  const totLain=lain.reduce((s,x)=>s+x.nilai,0);
  /* Baris isian: label dan titik dua di kolom A, nilainya digabung
     dari kolom B sampai kolom terakhir supaya tidak terjepit. */
  const isian=(r,label,nilai,o)=>{
    set("A"+r,label,(o&&o.tebalLabel)?{b:1}:{});
    const gaya=Object.assign({rata:"left"},(o&&o.gaya)||{});
    let isi=nilai;
    if(gaya.z) gaya.z=tempelTitik(gaya.z);           /* angka dan tanggal */
    else if(typeof nilai==="string") isi=": "+nilai;  /* teks */
    else gaya.z=PRE_TITIK+"General";
    set("B"+r,isi,gaya);
    ws.mergeCells("B"+r+":"+KOL(cAkhir)+r);
  };
  isian(rT+1,"Total Amount",{formula:KOL(cRem)+rT,result:totOmset},{tebalLabel:1,gaya:{z:FMT_RP,b:1}});
  isian(rT+2,"Amount In Words",terbilang(totOmset)+" Rupiah",{tebalLabel:1,gaya:{font:{italic:true}}});

  const cfg=DATA.config||{};
  const rB=rT+4;
  set("A"+rB,"B. CASH DEPOSITED",{b:1});
  [["Cash Deposited At",cfg.DEPOSIT_AT||""],["Cash Deposited In",cfg.DEPOSIT_IN||""],
   ["Cash Deposited By",cfg.DEPOSIT_BY||""],["Name",cfg.NAMA_PT||""],
   ["Bank Account",u.namaBank]].forEach((x,i)=>isian(rB+1+i,x[0],x[1],{gaya:{b:1}}));
  const rD=rB+6;

function terbilang(n){n=Math.round(Math.abs(n));if(n===0)return"Nol";
  const s=eja(n);return s.charAt(0).toUpperCase()+s.slice(1);}
function eja(x){const sat=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  if(x<12)return sat[x];
  if(x<20)return eja(x-10)+" belas";
  if(x<100)return eja(Math.floor(x/10))+" puluh"+ek(x%10);
  if(x<200)return"seratus"+ek(x-100);
  if(x<1000)return eja(Math.floor(x/100))+" ratus"+ek(x%100);
  if(x<2000)return"seribu"+ek(x-1000);
  if(x<1e6)return eja(Math.floor(x/1000))+" ribu"+ek(x%1000);
  if(x<1e9)return eja(Math.floor(x/1e6))+" juta"+ek(x%1e6);
  return eja(Math.floor(x/1e9))+" milyar"+ek(x%1e9);}
function ek(r){return r>0?" "+eja(r):"";}

/* ================= SALIN & UNDUH ================= */
/* Angka dikirim mentah tanpa pemisah ribuan supaya langsung terbaca
   sebagai angka saat ditempel ke Excel atau Google Sheet. */
function keTSV(aoa){
  return aoa.map(b=>b.map(v=>{
    if(v===null||v===undefined)return"";
    if(typeof v==="number")return String(v);
    return String(v).replace(/\t/g," ").replace(/\n/g," ");
  }).join("\t")).join("\n");
}
function keCSV(aoa){
  return aoa.map(b=>b.map(v=>{
    if(v===null||v===undefined)return"";
    if(typeof v==="number")return String(v);
    const t=String(v);
    return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  }).join(",")).join("\n");
}
function salin(aoa,tombol){
  const teks=keTSV(aoa);
  const sudah=()=>{const l=tombol.textContent;tombol.textContent="Tersalin";
    setTimeout(()=>tombol.textContent=l,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks).then(sudah).catch(()=>salinKuno(teks,sudah));
  }else salinKuno(teks,sudah);
}
function salinKuno(teks,sudah){
  const ta=document.createElement("textarea");
  ta.value=teks; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");sudah();}catch(e){alert("Salin otomatis ditolak browser. Blok tabelnya lalu tekan Ctrl+C.");}
  document.body.removeChild(ta);
}

   IA mencentang collect yang sudah diperiksa terhadap berkas dari GC:
   laporan kasir, bukti setor bank, dan penjelasan selisihnya. Layar ini
   tidak meminta berkasnya, hanya mencatat bahwa pemeriksaan sudah
   dilakukan, siapa yang melakukan, dan kapan.
   ============================================================ */
function peristiwaVerif(){
  const m={};
  const kunci=r=>r.unit+"|"+r.tglCollect;
  DATA.db.filter(r=>r.tglCollect).forEach(r=>{
    const k=kunci(r);
    m[k]=m[k]||{unit:r.unit,tglCollect:r.tglCollect,tglSetor:r.tglSetor||"",
                omset:0,deposit:0,terima:0,terimaLain:0,baris:[],lain:[],
                verifOleh:r.verifOleh||"",verifWaktu:r.verifWaktu||""};
    m[k].omset+=total(r); m[k].terima+=+r.totalCollect||0; m[k].baris.push(r);
    if(!m[k].tglSetor&&r.tglSetor)m[k].tglSetor=r.tglSetor;
    if(r.verifOleh){m[k].verifOleh=r.verifOleh;m[k].verifWaktu=r.verifWaktu||"";}
  });
  (DATA.lain||[]).filter(x=>x.tglCollect).forEach(x=>{
    const k=x.unit+"|"+x.tglCollect;
    m[k]=m[k]||{unit:x.unit,tglCollect:x.tglCollect,tglSetor:x.tglSetor||"",
                omset:0,deposit:0,terima:0,terimaLain:0,baris:[],lain:[],
                verifOleh:x.verifOleh||"",verifWaktu:x.verifWaktu||""};
    m[k].deposit+=x.nilai; m[k].terimaLain+=+x.totalCollect||0; m[k].lain.push(x);
    if(x.verifOleh){m[k].verifOleh=x.verifOleh;m[k].verifWaktu=x.verifWaktu||"";}
  });
  return Object.keys(m).map(k=>({kunci:k,...m[k]}));
}

/* Rincian per tanggal omset dan per outlet. Untuk unit dua outlet seperti
   PLS, omset dipisah Tigadari dan Pidari, sedangkan uang yang diterima
   melekat pada tanggalnya, bukan pada outletnya. */
function rincianVerif(x,u){
  const tgl=[...new Set(x.baris.map(r=>r.tgl))].sort();
  const banyak=u&&u.outlet.length>1;
  let h='<div class="gulir" style="padding:6px 0 12px"><table><thead><tr><th>Tanggal omset</th>'+
        (banyak?'<th>Outlet</th>':'')+
        '<th class="kanan">Breakfast</th><th class="kanan">Lunch</th><th class="kanan">Dinner</th>'+
        '<th class="kanan">Net</th><th class="kanan">Diterima</th></tr></thead><tbody>';
  tgl.forEach(t=>{
    const rr=x.baris.filter(r=>r.tgl===t);
    const ter=rr.reduce((s,r)=>s+(+r.totalCollect||0),0);
    const urut=(u?u.outlet:[]).map(o=>o.kode);
    rr.sort((a,b)=>urut.indexOf(a.outlet)-urut.indexOf(b.outlet));
    rr.forEach((r,i)=>{
      h+='<tr><td>'+(i===0?tglTeks(t):"")+'</td>'+
         (banyak?'<td>'+r.outlet+'</td>':'')+
         '<td class="kanan num">'+rp(r.bfast||0)+'</td>'+
         '<td class="kanan num">'+rp(r.lunch||0)+'</td>'+
         '<td class="kanan num">'+rp(r.dinner||0)+'</td>'+
         '<td class="kanan num">'+rp(total(r))+'</td>'+
         '<td class="kanan num">'+(i===0?rp(ter):"")+'</td></tr>';
    });
  });
  x.lain.forEach(l=>{
    h+='<tr><td>'+tglTeks(l.tgl)+'</td>'+(banyak?'<td></td>':'')+
       '<td colspan="3" class="rinci">'+namaJenis(l.jenis)+' · '+l.referensi+'</td>'+
       '<td class="kanan num">'+rp(l.nilai)+'</td>'+
       '<td class="kanan num">'+rp(l.totalCollect)+'</td></tr>';
  });
  if(x.baris.some(r=>r.catatan))
    h+='<tr><td colspan="'+(banyak?7:6)+'" class="rinci">Catatan GC: '+
       x.baris.filter(r=>r.catatan).map(r=>r.catatan)[0]+'</td></tr>';
  return h+'</tbody></table></div>';
}

  const aoaUnit=[["Unit","Nama","Entitas","Zona","Omset","Deposit","Ter-collect","Selisih",
