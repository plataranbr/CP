/* Tanggal setor menentukan berkas JV mana yang memuat penjemputan ini.
   Menggesernya berarti dua berkas berubah, jadi diberi tahu saat diubah. */
function cekGeserSetor(el){
  const k=document.getElementById("ketSetor");
  if(!k)return;
  const beda=(el.value||"")!==(el.dataset.awal||"");
  k.hidden=!beda;
  if(beda)k.textContent="Tanggal setor bergeser. JV tanggal "+
    (el.dataset.awal?tglTeks(el.dataset.awal):"lama")+" dan "+
    (el.value?tglTeks(el.value):"baru")+" ikut berubah.";
}

async function simpanKoreksi(unit,tglC){
  const p=document.getElementById("pesanKoreksi");
  const alasan=(document.getElementById("kAlasan").value||"").trim();
  const baris=[],lain=[];
  document.querySelectorAll("#panelEdit [data-kor]").forEach(i=>
    baris.push({tgl:i.dataset.kor,terima:angkaDari(i.value)}));
  document.querySelectorAll("#panelEdit [data-korl]").forEach(i=>
    lain.push({id:i.dataset.korl,terima:angkaDari(i.value)}));
  const tglSetor=document.getElementById("kSetor").value||"";
  if(baris.some(b=>b.terima<0)||lain.some(x=>x.terima<0)){
    p.className="pesan gagal";p.textContent="Nilai collect tidak boleh negatif.";return;}
  /* Alasan tidak dihalangi di sini. Yang menentukan wajib atau tidak
     adalah tanggal server, dan itu diperiksa di sisi yang menyimpan. */
  if(!alasan&&tglC!==hariServer()){
    p.className="pesan gagal";p.textContent="Alasan koreksi wajib diisi.";return;}
  try{
    if(adaServer) await panggil("koreksiCollect",{unit,tglCollect:tglC,tglSetor,alasan,baris,lain});
    baris.forEach(b=>{
      const rows=DATA.db.filter(r=>r.unit===unit&&r.tgl===b.tgl&&r.tglCollect===tglC)
                        .sort((x,y)=>urutOutlet(unit,x.outlet)-urutOutlet(unit,y.outlet));
      rows.forEach((r,i)=>{r.totalCollect=(i===0?b.terima:0);r.tglSetor=tglSetor;});
    });
    DATA.db.filter(r=>r.unit===unit&&r.tglCollect===tglC).forEach(r=>r.tglSetor=tglSetor);
    lain.forEach(x=>{const l=DATA.lain.find(y=>y.id===x.id);
      if(l)l.totalCollect=x.terima;});
    (DATA.lain||[]).filter(x=>x.unit===unit&&x.tglCollect===tglC)
      .forEach(x=>x.tglSetor=tglSetor);
    p.className="pesan";p.textContent=adaServer?"Tersimpan.":"Tersimpan sementara.";
    EDIT_KUNCI="";
    gambarCollect();gambarPosisi();
  }catch(e){p.className="pesan gagal";p.textContent="Gagal. "+e.message;}
}

async function bukaVerifikasi(unit,tglC){
  const p=document.getElementById("pesanBuka");
  const alasan=(document.getElementById("bAlasan").value||"").trim();
  if(!alasan){p.className="pesan gagal";p.textContent="Alasan wajib diisi.";return;}
  try{
    if(adaServer) await panggil("bukaVerifikasi",{unit,tglCollect:tglC,alasan});
    DATA.db.filter(r=>r.unit===unit&&r.tglCollect===tglC)
      .forEach(r=>{r.verifOleh="";r.verifWaktu="";});
    (DATA.lain||[]).filter(x=>x.unit===unit&&x.tglCollect===tglC)
      .forEach(x=>{x.verifOleh="";x.verifWaktu="";});
    gambarTersimpan();
  }catch(e){p.className="pesan gagal";p.textContent="Gagal. "+e.message;}
}

/* ================= EXPORT =================
   JV  : .xls, tata letak direplikasi persis dari berkas VHP.
         Semua isi mulai kolom B. Baris 11 sengaja dikosongkan.
   RPT : .xlsx lewat ExcelJS, karena SheetJS versi gratis tidak bisa
         menulis warna, garis, maupun formula ke .xls.
   Satu berkas untuk satu tanggal setor.
   ========================================================= */
const BULAN_PANJANG=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI",
                     "AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const BULAN_PENDEK=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

const FMT_AKUN='_-* #,##0_-;\\-* #,##0_-;_-* "-"_-;_-@_-';
const FMT_RP='"Rp"#,##0';
const FMT_TGL_DESKTOP='dd\\-mm\\-yy';
const FMT_TGL_CLOUD='mm/dd/yyyy';
const FMT_TGL_BARIS='dd-mmm-yyyy';
const FMT_TGL_SETOR='[$-C09]dd-mmm-yy;@';
/* [$-F800] menyerahkan bentuknya ke setelan tanggal panjang sistem, jadi
   isinya berubah antar komputer dan teks sisipan diabaikan. Bentuknya
   ditulis tegas supaya sama di mana pun berkas dibuka. */
const FMT_TGL_PANJANG='[$-409]dd mmmm yyyy';
const BIRU="FF1F4E78", KUNING="FFFFF2CC";
/* Titik dua ditempel di awal kolom B lewat format angka, supaya semua
   titik dua berdiri di satu garis lurus tanpa perlu kolom tambahan. */
const PRE_TITIK='": "';
/* Kode wilayah seperti [$-F800] harus tetap berada paling depan, jadi
   awalan titik dua disisipkan sesudahnya, bukan sebelumnya. */
const tempelTitik=z=>{const m=String(z).match(/^(\[[^\]]*\])([\s\S]*)$/);
  return m?m[1]+PRE_TITIK+m[2]:PRE_TITIK+z;};
const GARIS={top:{style:"thin"},left:{style:"thin"},bottom:{style:"thin"},right:{style:"thin"}};

const KOL=i=>{let s="",n=i;do{s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)-1;}while(n>=0);return s;};
const serialTgl=t=>Math.round(new Date(t+"T00:00:00Z").getTime()/864e5)+25569;
const tglUTC=t=>new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)));
const fmtID=t=>{const d=tglUTC(t);
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear();};
const fmtPendek=t=>{const d=tglUTC(t);
  return d.getUTCDate()+" "+BULAN_PENDEK[d.getUTCMonth()]+" "+d.getUTCFullYear();};

/* Kode JV diturunkan dari bulan yang dipilih: dua digit bulan diikuti dua
   digit tahun. Urutan tiga digit mengikuti posisi tanggal setor di dalam
   bulan itu, jadi setoran yang diinput mundur akan menggeser nomor
   sesudahnya. Nomor tiap tanggal ditampilkan di tabel sebelum diunduh. */
function kodeDari(bulan){ return bulan.slice(5,7)+bulan.slice(2,4); }
function periodeDari(bulan){ return BULAN_PANJANG[+bulan.slice(5,7)-1]+"-"+bulan.slice(0,4); }
function isiPeriode(){
  const b=document.getElementById("eBulan").value;
  if(!/^\d{4}-\d{2}$/.test(b))return;
  document.getElementById("ePeriode").value=periodeDari(b);
  document.getElementById("eKode").value=kodeDari(b);
  pratinjauJV();
}
function pratinjauJV(){
  const k=document.getElementById("eKode").value.trim();
  const el=document.getElementById("ePratinjau");
  if(el)el.textContent=k?"BK-GC"+k+"-001":"—";
  if(!document.getElementById("panExport").hidden)gambarExport();
}
function tglSetorBulan(kode,bulan){
  const a=DATA.db.filter(r=>r.unit===kode&&r.tglSetor&&r.tglSetor.slice(0,7)===bulan).map(r=>r.tglSetor);
  const b=(DATA.lain||[]).filter(x=>x.unit===kode&&x.tglSetor&&x.tglSetor.slice(0,7)===bulan).map(x=>x.tglSetor);
  return [...new Set(a.concat(b))].sort();
}
function nomorJV(kode,bulan,t){
  const kodeJV=(document.getElementById("eKode").value||kodeDari(bulan)).trim();
  const idx=tglSetorBulan(kode,bulan).indexOf(t);
  return "BK-GC"+kodeJV+"-"+String(idx+1).padStart(3,"0");
}

/* Merangkai data satu tanggal setor: per tanggal omset, per outlet,
   urut mengikuti URUT_OUTLET di MASTER_UNIT. */
function dataSetor(kode,t){
  const u=unitUnik().find(x=>x.kode===kode);
  const rows=DATA.db.filter(r=>r.unit===kode&&r.tglSetor===t);
  const tgl=[...new Set(rows.map(r=>r.tgl))].sort();
  const hari=tgl.map(d=>{
    const rr=rows.filter(r=>r.tgl===d);
    return {tgl:d,
      terima:rr.reduce((s,r)=>s+(+r.totalCollect||0),0),
      per:u.outlet.map(o=>{
        const r=rr.find(x=>x.outlet===o.kode)||{};
        return {label:o.kode, bfast:+r.bfast||0, lunch:+r.lunch||0, dinner:+r.dinner||0,
                nilai:(+r.bfast||0)+(+r.lunch||0)+(+r.dinner||0)};})};
  });
  const lain=(DATA.lain||[]).filter(x=>x.unit===kode&&x.tglSetor===t).map(x=>{
    const j=(DATA.jenis||[]).find(a=>a[0]===x.jenis)||[];
    return {tgl:x.tgl, nama:j[1]||"Advance deposit", akun:j[2]||"",
            nilai:+x.totalCollect||0, referensi:x.referensi||""};});
  return {u,hari,lain};
}

function gambarExport(){
  const kode=document.getElementById("eUnit").value,bulan=document.getElementById("eBulan").value;
  if(!document.getElementById("eKode").value)isiPeriode();
  const tgl=tglSetorBulan(kode,bulan);
  if(!tgl.length){document.getElementById("isiExport").innerHTML=
    '<div class="kosongan">Belum ada setoran untuk unit dan bulan itu.</div>';return;}
  let h='<div class="gulir"><table><thead><tr><th>Tanggal setor</th><th>Nomor JV</th>'+
        '<th class="kanan">Omset</th><th class="kanan">Deposit</th>'+
        '<th class="kanan">Hari omset</th><th>Berkas</th></tr></thead><tbody>';
  tgl.forEach(t=>{
    const d=dataSetor(kode,t);
    const omset=d.hari.reduce((s,x)=>s+x.terima,0);
    const dep=d.lain.reduce((s,x)=>s+x.nilai,0);
    h+='<tr><td>'+tglTeks(t)+'</td><td class="num">'+nomorJV(kode,bulan,t)+'</td>'+
       '<td class="kanan num">'+rp(omset)+'</td>'+
       '<td class="kanan num">'+(dep?rp(dep):"—")+'</td>'+
       '<td class="kanan num">'+d.hari.length+'</td>'+
       '<td><button class="halus" onclick="unduhJV(\''+kode+'\',\''+t+'\')">JV .xls</button> '+
       '<button class="halus" onclick="unduhReport(\''+kode+'\',\''+t+'\')">Report .xlsx</button></td></tr>';
  });
  h+='</tbody></table></div><div class="bar"><span class="pesan" id="pesanExport"></span></div>';
  const belum=tgl.filter(t=>DATA.db.some(r=>r.unit===kode&&r.tglSetor===t&&!r.verifOleh));
  if(belum.length)
    h+='<p class="catatan" style="color:var(--stamp)">'+belum.length+
       ' tanggal setor belum diverifikasi Income Auditor.</p>';
  document.getElementById("isiExport").innerHTML=h;
}
function pesanEx(teks,gagal){
  const p=document.getElementById("pesanExport");
  if(p){p.className="pesan"+(gagal?" gagal":"");p.textContent=teks;}
}

/* ---------- JV .xls ---------- */
function barisJurnal(u,hari,lain){
  const banyak=u.outlet.length>1, out=[];
  hari.forEach(h=>{
    const sistem=h.per.reduce((s,p)=>s+p.nilai,0);
    const vr=h.terima-sistem;
    const rmk="CASH SALES "+u.kode+" "+fmtID(h.tgl);
    out.push({desc:u.namaBank,akun:u.akunBank,debit:h.terima,kredit:"",remark:rmk});
    h.per.forEach(p=>out.push({desc:"CASH SALES CLEAREANCE",akun:u.akunClr,debit:"",kredit:p.nilai,
      remark:banyak?"CASH SALES "+p.label+" "+u.kode+" "+fmtID(h.tgl):rmk}));
    if(vr!==0)out.push({desc:"OVERAGES/SHORTAGES",akun:u.akunOvr,
      debit:vr<0?Math.abs(vr):"",kredit:vr>0?vr:"",remark:rmk});
  });
  (lain||[]).forEach(x=>{
    const rmk=x.nama.toUpperCase()+" "+u.kode+" "+fmtID(x.tgl)+" - "+x.referensi;
    out.push({desc:u.namaBank,akun:u.akunBank,debit:x.nilai,kredit:"",remark:rmk});
    out.push({desc:x.nama.toUpperCase(),akun:x.akun,debit:"",kredit:x.nilai,remark:rmk});
  });
  return out;
}
function unduhJV(kode,t){
  const bulan=document.getElementById("eBulan").value;
  const {u,hari,lain}=dataSetor(kode,t);
  if(!hari.length&&!lain.length){pesanEx("Tidak ada data untuk tanggal itu.",1);return;}
  const periode=(document.getElementById("ePeriode").value||periodeDari(bulan)).trim();
  const noJV=nomorJV(kode,bulan,t);
  const cloud=u.varian==="VHP_CLOUD";
  const ws={};
  const S=(a,v)=>{ws[a]={t:"s",v:String(v)};};
  const N=(a,v,z)=>{ws[a]={t:"n",v:Number(v)};if(z)ws[a].z=z;};

  if(cloud){
    S("B2","Version 1.0.0");
    S("B3",u.kode+"\nJOURNAL VOUCHER");
    S("B6",periode); S("C6",periode);
    S("E6","Journal Date"); N("F6",serialTgl(t),FMT_TGL_CLOUD);
    S("B7",noJV); S("C7",noJV);
    S("B8","CASH SALES "+u.kode); S("C8","CASH SALES "+u.kode);
    ["Account","Description","Debit","Credit","Remarks"].forEach((x,i)=>S(KOL(1+i)+"10",x));
  }else{
    S("B4","JOURNAL VOUCHER");
    S("B6","Period     : "+periode);
    S("E6","Journal Date"); N("F6",serialTgl(t),FMT_TGL_DESKTOP);
    S("B7","No. JV     : "+noJV);
    S("B8","Name JV : CASH SALES "+u.kode);
    ["Description","Account","Debit","Credit","Remarks"].forEach((x,i)=>S(KOL(1+i)+"10",x));
  }
  let r=12,tDeb=0,tKre=0;
  barisJurnal(u,hari,lain).forEach(b=>{
    if(cloud){S("B"+r,b.akun);S("C"+r,b.desc);}else{S("B"+r,b.desc);S("C"+r,b.akun);}
    if(b.debit!==""){N("D"+r,b.debit,FMT_AKUN);tDeb+=+b.debit;}
    if(b.kredit!==""){N("E"+r,b.kredit,FMT_AKUN);tKre+=+b.kredit;}
    S("F"+r,b.remark); r++;
  });
  S("C"+r,"TOTAL"); N("D"+r,tDeb,FMT_AKUN); N("E"+r,tKre,FMT_AKUN);
  S("C"+(r+1),"Selisih (harus 0)"); N("E"+(r+1),tKre-tDeb,FMT_AKUN);
  ws["!ref"]="A1:F"+(r+1);
  ws["!merges"]=[cloud?{s:{r:2,c:1},e:{r:2,c:5}}:{s:{r:3,c:1},e:{r:3,c:5}}];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,String(tglUTC(t).getUTCDate()));
  XLSX.writeFile(wb,"JV_"+kode+"_"+t.replace(/-/g,"")+".xls",{bookType:"xls"});
  pesanEx("JV "+noJV+" dibuat"+(tKre!==tDeb?" — PERHATIAN, debit dan kredit tidak seimbang.":"."),tKre!==tDeb);
}

/* ---------- Report .xlsx ---------- */
let EXCELJS_SIAP=null;
function muatExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  if(EXCELJS_SIAP)return EXCELJS_SIAP;
  const sumber=["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",
                "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
  EXCELJS_SIAP=new Promise((ok,gagal)=>{
    let i=0;
    const coba=()=>{
      if(i>=sumber.length){gagal(new Error("Pustaka Excel tidak bisa dimuat."));return;}
      const s=document.createElement("script");
      s.src=sumber[i++]; s.onload=()=>ok(); s.onerror=coba;
      document.head.appendChild(s);
    };
    coba();
  });
  return EXCELJS_SIAP;
}
async function unduhReport(kode,t){
  const {u,hari,lain}=dataSetor(kode,t);
  if(!hari.length&&!lain.length){pesanEx("Tidak ada data untuk tanggal itu.",1);return;}
  pesanEx("Menyiapkan Report…");
  try{ await muatExcelJS(); }
  catch(e){ pesanEx("Gagal memuat pustaka Excel. Periksa sambungan internet.",1); return; }

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Report");
  const nOut=u.outlet.length, multi=nOut>1;
  const cShift=1+(multi?0:1), cNet=cShift+3*nOut, cRem=cNet+1, cOvr=cNet+2, cAkhir=cOvr;
  const set=(a,v,o)=>{
    const c=ws.getCell(a); c.value=v; o=o||{};
    if(o.z)c.numFmt=o.z;
    if(o.b)c.font=Object.assign({bold:true},o.font||{}); else if(o.font)c.font=o.font;
    if(o.fill)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:o.fill}};
    if(o.garis)c.border=GARIS;
    if(o.rata)c.alignment={horizontal:o.rata,vertical:"middle",wrapText:!!o.wrap};
    return c;
  };
  for(let c=0;c<=cAkhir;c++){
    const cell=ws.getCell(KOL(c)+"2");
    cell.alignment={horizontal:"centerContinuous"}; cell.font={bold:true,size:12};
  }
  ws.getCell("A2").value="GENERAL CASHIER'S DAILY REMITTANCE & CASH DEPOSIT REPORT";
  set("A4","A. CASH REMITTANCE",{b:1});
  set(KOL(cAkhir-1)+"4","Tgl Setor :",{b:1,rata:"right"});
  set(KOL(cAkhir)+"4",tglUTC(t),{z:FMT_TGL_SETOR});
  set("A5","Omset tgl :",{font:{italic:true,size:9}});
  set("B5",hari.map(x=>fmtPendek(x.tgl)).join(", "),{font:{italic:true,size:9}});
  ws.mergeCells("B5:"+KOL(cAkhir-2)+"5");

  const kepala={fill:BIRU,font:{bold:true,color:{argb:"FFFFFFFF"},size:9},garis:1,rata:"center",wrap:true};
  set("A7","DATE",kepala); ws.mergeCells("A7:A8");
  if(multi){
    u.outlet.forEach((o,i)=>{
      const c0=cShift+3*i;
      set(KOL(c0)+"7",o.kode,kepala);
      ws.mergeCells(KOL(c0)+"7:"+KOL(c0+2)+"7");
      ["Breakfast","Lunch","Dinner"].forEach((s,j)=>set(KOL(c0+j)+"8",s,kepala));
    });
  }else{
    set("B7","OUTLET",kepala); ws.mergeCells("B7:B8");
    set(KOL(cShift)+"7","OUTLET CASHIER SHIFT",kepala);
    ws.mergeCells(KOL(cShift)+"7:"+KOL(cShift+2)+"7");
    ["Breakfast","Lunch","Dinner"].forEach((s,j)=>set(KOL(cShift+j)+"8",s,kepala));
  }
  [[cNet,"NET CASH"],[cRem,"AMOUNT REMITTED TO GC"],[cOvr,"(SHORT) OVERAGE"]].forEach(x=>{
    set(KOL(x[0])+"7",x[1],kepala); ws.mergeCells(KOL(x[0])+"7:"+KOL(x[0])+"8");
  });

  /* Formula disertai nilai hasilnya, supaya angka sudah terbaca sebelum
     Excel sempat menghitung ulang. */
  const r0=9, mat=[];
  hari.forEach((h,i)=>{
    const r=r0+i, baris={};
    let net=0;
    set("A"+r,tglUTC(h.tgl),{z:FMT_TGL_BARIS,garis:1});
    if(!multi)set("B"+r,u.kode,{garis:1});
    u.outlet.forEach((o,k)=>{
      const p=h.per[k]||{}, c0=cShift+3*k;
      [+p.bfast||0,+p.lunch||0,+p.dinner||0].forEach((v,j)=>{
        set(KOL(c0+j)+r,v,{z:FMT_AKUN,garis:1}); baris[c0+j]=v; net+=v;});
    });
    baris[cNet]=net; baris[cRem]=h.terima; baris[cOvr]=h.terima-net;
    set(KOL(cNet)+r,{formula:"SUM("+KOL(cShift)+r+":"+KOL(cNet-1)+r+")",result:net},
        {z:FMT_AKUN,garis:1});
    set(KOL(cRem)+r,h.terima,{z:FMT_AKUN,garis:1});
    set(KOL(cOvr)+r,{formula:KOL(cRem)+r+"-"+KOL(cNet)+r,result:h.terima-net},
        {z:FMT_AKUN,garis:1});
    mat.push(baris);
  });

  const rT=r0+hari.length, total={b:1,fill:KUNING,garis:1};
  set("A"+rT,"TOTAL",total);
  if(!multi)set("B"+rT,"",total);
  for(let c=cShift;c<=cOvr;c++)
    set(KOL(c)+rT,{formula:"SUM("+KOL(c)+r0+":"+KOL(c)+(rT-1)+")",
                   result:mat.reduce((a,b)=>a+(b[c]||0),0)},Object.assign({z:FMT_AKUN},total));

  const totOmset=hari.reduce((s,x)=>s+x.terima,0);
  const totLain=lain.reduce((s,x)=>s+x.nilai,0);
  /* Baris isian: label dan titik dua di kolom A, nilainya digabung
     dari kolom B sampai kolom terakhir supaya tidak terjepit. */
  const isian=(r,label,nilai,o)=>{
    set("A"+r,label,(o&&o.tebalLabel)?{b:1}:{});
    const gaya=Object.assign({rata:"left"},(o&&o.gaya)||{});
    let isi=nilai;
    if(gaya.z) gaya.z=tempelTitik(gaya.z);           /* angka dan tanggal */
    else if(typeof nilai==="string") isi=": "+nilai;  /* teks */
    else gaya.z=PRE_TITIK+"General";
    set("B"+r,isi,gaya);
    ws.mergeCells("B"+r+":"+KOL(cAkhir)+r);
  };
  isian(rT+1,"Total Amount",{formula:KOL(cRem)+rT,result:totOmset},{tebalLabel:1,gaya:{z:FMT_RP,b:1}});
  isian(rT+2,"Amount In Words",terbilang(totOmset)+" Rupiah",{tebalLabel:1,gaya:{font:{italic:true}}});

  const cfg=DATA.config||{};
  const rB=rT+4;
  set("A"+rB,"B. CASH DEPOSITED",{b:1});
  [["Cash Deposited At",cfg.DEPOSIT_AT||""],["Cash Deposited In",cfg.DEPOSIT_IN||""],
   ["Cash Deposited By",cfg.DEPOSIT_BY||""],["Name",cfg.NAMA_PT||""],
   ["Bank Account",u.namaBank]].forEach((x,i)=>isian(rB+1+i,x[0],x[1],{gaya:{b:1}}));
  const rD=rB+6;
  isian(rD,  "Deposit Date",   tglUTC(t), {gaya:{z:FMT_TGL_PANJANG,b:1}});
  isian(rD+1,"Amount Omzet",   totOmset,  {gaya:{z:FMT_RP,b:1}});
  isian(rD+2,"Amount Deposit", totLain,   {gaya:{z:FMT_RP,b:1}});
  isian(rD+3,"Total Amount",   {formula:"B"+(rD+1)+"+B"+(rD+2),result:totOmset+totLain},
        {tebalLabel:1,gaya:{z:FMT_RP,b:1}});
  isian(rD+4,"Amount In Words",terbilang(totOmset+totLain)+" Rupiah",{gaya:{font:{italic:true}}});

  const rS=rD+7, cApr=cAkhir-1;
  set("A"+rS,"Prepared by,"); set("D"+rS,"Verified by,"); set(KOL(cApr)+rS,"Approved by,");
  set("A"+(rS+6),"General Cashier",{b:1});
  set("D"+(rS+6),"Income Auditor",{b:1});
  set(KOL(cApr)+(rS+6),"Financial Controller",{b:1});

  ws.getColumn(1).width=19;
  for(let c=1;c<=cAkhir;c++)ws.getColumn(c+1).width=(c===cRem?16:13);
  ws.getRow(7).height=30;
  ws.pageSetup={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,
                margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}};

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="RPT_"+kode+"_"+t.replace(/-/g,"")+".xlsx";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},400);
  pesanEx("Report dibuat.");
}

function terbilang(n){n=Math.round(Math.abs(n));if(n===0)return"Nol";
  const s=eja(n);return s.charAt(0).toUpperCase()+s.slice(1);}
function eja(x){const sat=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
  if(x<12)return sat[x];
  if(x<20)return eja(x-10)+" belas";
  if(x<100)return eja(Math.floor(x/10))+" puluh"+ek(x%10);
  if(x<200)return"seratus"+ek(x-100);
  if(x<1000)return eja(Math.floor(x/100))+" ratus"+ek(x%100);
  if(x<2000)return"seribu"+ek(x-1000);
  if(x<1e6)return eja(Math.floor(x/1000))+" ribu"+ek(x%1000);
  if(x<1e9)return eja(Math.floor(x/1e6))+" juta"+ek(x%1e6);
  return eja(Math.floor(x/1e9))+" milyar"+ek(x%1e9);}
function ek(r){return r>0?" "+eja(r):"";}

/* ================= SALIN & UNDUH ================= */
/* Angka dikirim mentah tanpa pemisah ribuan supaya langsung terbaca
   sebagai angka saat ditempel ke Excel atau Google Sheet. */
function keTSV(aoa){
  return aoa.map(b=>b.map(v=>{
    if(v===null||v===undefined)return"";
    if(typeof v==="number")return String(v);
    return String(v).replace(/\t/g," ").replace(/\n/g," ");
  }).join("\t")).join("\n");
}
function keCSV(aoa){
  return aoa.map(b=>b.map(v=>{
    if(v===null||v===undefined)return"";
    if(typeof v==="number")return String(v);
    const t=String(v);
    return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  }).join(",")).join("\n");
}
function salin(aoa,tombol){
  const teks=keTSV(aoa);
  const sudah=()=>{const l=tombol.textContent;tombol.textContent="Tersalin";
    setTimeout(()=>tombol.textContent=l,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks).then(sudah).catch(()=>salinKuno(teks,sudah));
  }else salinKuno(teks,sudah);
}
function salinKuno(teks,sudah){
  const ta=document.createElement("textarea");
  ta.value=teks; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");sudah();}catch(e){alert("Salin otomatis ditolak browser. Blok tabelnya lalu tekan Ctrl+C.");}
  document.body.removeChild(ta);
}
function unduhTeks(nama,isi,tipe){
  const b=new Blob(["\ufeff"+isi],{type:tipe+";charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=nama;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);document.body.removeChild(a);},400);
}
function unduhXLSX(nama,daftar){
  const wb=XLSX.utils.book_new();
  daftar.forEach(x=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(x.aoa),x.nama));
  XLSX.writeFile(wb,nama);
}

/* ================= VERIFIKASI =================
   IA mencentang collect yang sudah diperiksa terhadap berkas dari GC:
   laporan kasir, bukti setor bank, dan penjelasan selisihnya. Layar ini
   tidak meminta berkasnya, hanya mencatat bahwa pemeriksaan sudah
   dilakukan, siapa yang melakukan, dan kapan.
   ============================================================ */
function peristiwaVerif(){
  const m={};
  const kunci=r=>r.unit+"|"+r.tglCollect;
  DATA.db.filter(r=>r.tglCollect).forEach(r=>{
    const k=kunci(r);
    m[k]=m[k]||{unit:r.unit,tglCollect:r.tglCollect,tglSetor:r.tglSetor||"",
                omset:0,deposit:0,terima:0,terimaLain:0,baris:[],lain:[],
                verifOleh:r.verifOleh||"",verifWaktu:r.verifWaktu||""};
    m[k].omset+=total(r); m[k].terima+=+r.totalCollect||0; m[k].baris.push(r);
    if(!m[k].tglSetor&&r.tglSetor)m[k].tglSetor=r.tglSetor;
    if(r.verifOleh){m[k].verifOleh=r.verifOleh;m[k].verifWaktu=r.verifWaktu||"";}
  });
  (DATA.lain||[]).filter(x=>x.tglCollect).forEach(x=>{
    const k=x.unit+"|"+x.tglCollect;
    m[k]=m[k]||{unit:x.unit,tglCollect:x.tglCollect,tglSetor:x.tglSetor||"",
                omset:0,deposit:0,terima:0,terimaLain:0,baris:[],lain:[],
                verifOleh:x.verifOleh||"",verifWaktu:x.verifWaktu||""};
    m[k].deposit+=x.nilai; m[k].terimaLain+=+x.totalCollect||0; m[k].lain.push(x);
    if(x.verifOleh){m[k].verifOleh=x.verifOleh;m[k].verifWaktu=x.verifWaktu||"";}
  });
  return Object.keys(m).map(k=>({kunci:k,...m[k]}));
}

function siapkanSaringVerif(){
  const su=document.getElementById("vUnit");
  if(!su)return;
  const pilih=su.value;
  su.innerHTML='<option value="">Semua unit</option>'+
    unitUnik().filter(u=>!ENT_VERIF||u.entitas===ENT_VERIF)
      .map(u=>'<option value="'+u.kode+'">'+u.kode+'</option>').join("");
  su.value=[...su.options].some(o=>o.value===pilih)?pilih:"";
}

  const box=document.getElementById("isiVerifikasi");
  if(!box)return;
  siapkanSaringVerif();
  const mode=(document.getElementById("vSaring")||{}).value||"belum";
  const unit=(document.getElementById("vUnit")||{}).value||"";
  const d1=(document.getElementById("vDari")||{}).value||"";
  const d2=(document.getElementById("vSampai")||{}).value||"";
  const adm=DATA.aku&&DATA.aku.peran==="ADMIN";
  const A=acuan();

  const BV=+DATA.config.BATAS_VERIF_HARI||3;
  const BS=+DATA.config.BATAS_SETOR_HARI||1;
  const peta={}; unitUnik().forEach(u=>peta[u.kode]=u);

  let p=peristiwaVerif().filter(x=>{
    const u=peta[x.unit];
    if(!u)return false;
    if(mode==="sudah"?!x.verifOleh:!!x.verifOleh)return false;
    if(ENT_VERIF&&u.entitas!==ENT_VERIF)return false;
    if(unit&&x.unit!==unit)return false;
    const t=x.tglSetor||x.tglCollect;
    if(d1&&t<d1)return false;
    if(d2&&t>d2)return false;
    return true;});

  let h="";
  if(GANDA&&adm)
    h+='<p class="catatan" style="color:var(--stamp)">'+GANDA+' baris collect ganda dinetralkan '+
       'sementara di layar. Sheet DB masih perlu dirapikan.</p>';
  if(!p.length){

      (mode==="sudah"?"Belum ada yang diverifikasi.":"Tidak ada yang menunggu verifikasi.")+'</div>';
    return;
  }

  /* Dikelompokkan per tanggal setor, karena satu tanggal setor sama dengan
     satu berkas JV dan satu bukti setor bank. */
  const grup={};
  p.forEach(x=>{const t=x.tglSetor||"(belum disetor)";(grup[t]=grup[t]||[]).push(x);});
  const urutTgl=Object.keys(grup).sort();
  if(mode==="sudah")urutTgl.reverse();

  urutTgl.forEach(t=>{
    const arr=grup[t].sort((a,b)=>a.unit.localeCompare(b.unit));
    const jSis=arr.reduce((s,x)=>s+x.omset+x.deposit,0);
    const jTer=arr.reduce((s,x)=>s+x.terima+x.terimaLain,0);
    h+='<div class="blok" style="margin-top:20px"><div class="judul">'+
       '<h2>'+(t==="(belum disetor)"?"Belum Disetor":"Setor "+tglTeks(t))+' · '+arr.length+' unit</h2>'+
       '<span class="biaya">sistem <b class="num">'+rp(jSis)+'</b> · diterima <b class="num">'+
       rp(jTer)+'</b></span></div>';
    h+='<div class="gulir"><table class="stack"><thead><tr>'+
       (mode==="sudah"?'':'<th style="width:40px">Ya</th>')+
       '<th>Unit</th><th>Jemput</th><th class="kanan">Omset sistem</th>'+
       '<th class="kanan">Deposit</th><th class="kanan">Diterima GC</th>'+
       '<th class="kanan">Selisih</th><th>'+(mode==="sudah"?'Diverifikasi':'Status')+'</th>'+
       '</tr></thead><tbody>';
    arr.forEach(x=>{
      const sis=x.omset+x.deposit, ter=x.terima+x.terimaLain, sel=ter-sis;
      const tunggu=beda(x.tglCollect,A);
      const jeda=x.tglSetor?beda(x.tglCollect,x.tglSetor):null;
      const besar=AMB&&Math.abs(sel)>AMB;
      const belumSetorIni=!x.tglSetor;
      const kunci=(besar&&!adm)||belumSetorIni;
      const tanda=[];
      if(besar)tanda.push('<span class="tag n">selisih besar</span>');
      if(tunggu>BV)tanda.push('<span class="tag u">menunggu '+tunggu+' hari</span>');
      if(jeda!==null&&jeda>BS)tanda.push('<span class="tag u">setor H+'+jeda+'</span>');
      if(belumSetorIni)tanda.push('<span class="tag d">menunggu tanggal setor</span>');
      const id=x.kunci.replace(/[^A-Za-z0-9]/g,"_");
      h+='<tr>'+
        (mode==="sudah"?'':'<td class="tengah" data-l="Verifikasi">'+
          (belumSetorIni?'<span class="rinci" title="menunggu tanggal setor">&#128274;</span>'
            :'<input type="checkbox" data-v="'+x.kunci+'"'+(kunci?" disabled":"")+'>')+'</td>')+
        '<td data-l="Unit"><b>'+x.unit+'</b>'+
          '<button class="tombolRinci" id="tb_'+id+'" onclick="bukaVerif(\''+id+'\')">rincian</button></td>'+
        '<td data-l="Jemput">'+tglTeks(x.tglCollect)+'</td>'+
        '<td class="kanan num" data-l="Omset sistem">'+rp(x.omset)+'</td>'+
        '<td class="kanan num" data-l="Deposit">'+(x.deposit?rp(x.deposit):"—")+'</td>'+
        '<td class="kanan num" data-l="Diterima GC">'+rp(ter)+'</td>'+
        '<td class="kanan num" data-l="Selisih" style="color:'+
          (sel<0?"var(--stamp)":(sel>0?"var(--amber)":"var(--ink3)"))+'">'+
          (sel>0?"+":"")+rp(sel)+'</td>'+
        '<td data-l="Status">'+(mode==="sudah"
          ? '<span class="rinci">'+x.verifOleh+(x.verifWaktu?" · "+tglTeks(x.verifWaktu):"")+'</span>'
          : (tanda.join(" ")||'<span class="rinci">sesuai</span>')+
            (kunci&&!belumSetorIni?'<div class="rinci">perlu dicentang admin</div>':''))+'</td></tr>';
      h+='<tr class="detail" id="dt_'+id+'"><td colspan="8" style="padding:0">'+
         rincianVerif(x,peta[x.unit])+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  if(mode!=="sudah")
    h+='<p class="catatan">Centang berarti berkas dari GC sudah diperiksa. '+
       'Setelah tercentang, nilainya hanya bisa diubah admin.</p>';
  box.innerHTML=h;
}
/* Rincian per tanggal omset dan per outlet. Untuk unit dua outlet seperti
   PLS, omset dipisah Tigadari dan Pidari, sedangkan uang yang diterima
   melekat pada tanggalnya, bukan pada outletnya. */
function rincianVerif(x,u){
  const tgl=[...new Set(x.baris.map(r=>r.tgl))].sort();
  const banyak=u&&u.outlet.length>1;
  let h='<div class="gulir" style="padding:6px 0 12px"><table><thead><tr><th>Tanggal omset</th>'+
        (banyak?'<th>Outlet</th>':'')+
        '<th class="kanan">Breakfast</th><th class="kanan">Lunch</th><th class="kanan">Dinner</th>'+
        '<th class="kanan">Net</th><th class="kanan">Diterima</th></tr></thead><tbody>';
  tgl.forEach(t=>{
    const rr=x.baris.filter(r=>r.tgl===t);
    const ter=rr.reduce((s,r)=>s+(+r.totalCollect||0),0);
    const urut=(u?u.outlet:[]).map(o=>o.kode);
    rr.sort((a,b)=>urut.indexOf(a.outlet)-urut.indexOf(b.outlet));
    rr.forEach((r,i)=>{
      h+='<tr><td>'+(i===0?tglTeks(t):"")+'</td>'+
         (banyak?'<td>'+r.outlet+'</td>':'')+
         '<td class="kanan num">'+rp(r.bfast||0)+'</td>'+
         '<td class="kanan num">'+rp(r.lunch||0)+'</td>'+
         '<td class="kanan num">'+rp(r.dinner||0)+'</td>'+
         '<td class="kanan num">'+rp(total(r))+'</td>'+
         '<td class="kanan num">'+(i===0?rp(ter):"")+'</td></tr>';
    });
  });
  x.lain.forEach(l=>{
    h+='<tr><td>'+tglTeks(l.tgl)+'</td>'+(banyak?'<td></td>':'')+
       '<td colspan="3" class="rinci">'+namaJenis(l.jenis)+' · '+l.referensi+'</td>'+
       '<td class="kanan num">'+rp(l.nilai)+'</td>'+
       '<td class="kanan num">'+rp(l.totalCollect)+'</td></tr>';
  });
  if(x.baris.some(r=>r.catatan))
    h+='<tr><td colspan="'+(banyak?7:6)+'" class="rinci">Catatan GC: '+
       x.baris.filter(r=>r.catatan).map(r=>r.catatan)[0]+'</td></tr>';
  return h+'</tbody></table></div>';
}
function bukaVerif(id){
  const d=document.getElementById("dt_"+id), t=document.getElementById("tb_"+id);
  if(!d)return;
  if(t)t.textContent=d.classList.toggle("buka")?"tutup":"rincian";
}
async function simpanVerifikasi(){
  const p=document.getElementById("pesanVerif");
  const pilih=[...document.querySelectorAll("#isiVerifikasi [data-v]")]
    .filter(c=>c.checked).map(c=>{const [unit,tglCollect]=c.dataset.v.split("|");
      return {unit,tglCollect};});
  if(!pilih.length){p.className="pesan gagal";p.textContent="Belum ada yang dicentang.";return;}
  try{
    if(adaServer) await panggil("verifikasi",pilih);
    const cap=(DATA.aku&&DATA.aku.nama)||"", kini=hariIni();
    pilih.forEach(x=>{
      DATA.db.filter(r=>r.unit===x.unit&&r.tglCollect===x.tglCollect)
        .forEach(r=>{r.verifOleh=cap;r.verifWaktu=kini;});
      (DATA.lain||[]).filter(r=>r.unit===x.unit&&r.tglCollect===x.tglCollect)
        .forEach(r=>{r.verifOleh=cap;r.verifWaktu=kini;});
    });
    p.className="pesan";p.textContent=pilih.length+" collect diverifikasi.";
    gambarVerifikasi();
  }catch(e){p.className="pesan gagal";p.textContent="Gagal. "+e.message;}
}

function gambarAnalisa(){
  const bulan=document.getElementById("aBulan").value;
  const box=document.getElementById("isiAnalisa");
  const rows=DATA.db.filter(r=>r.tgl.slice(0,7)===bulan);
  if(!rows.length){
    /* Riwayat koreksi tetap ditampilkan, karena saringan tanggalnya
       berdiri sendiri dan bisa menunjuk bulan lain. */
    box.innerHTML='<div class="kosongan">Tidak ada data omset di bulan itu.</div>'+
                  '<div id="riwayatKoreksi"></div>';
    ANALISA={bulan:bulan,ringkas:[["Keterangan","Nilai"],["Bulan",bulan]],
             unit:[["Unit"]],kelompok:[["Jenis"]],entitas:[],zona:[],
             koreksi:[["Waktu","Jenis","Unit","Tgl collect","Tgl omset","Nilai lama","Nilai baru",
                       "Selisih","Sudah setor","Oleh","Alasan"]],semua:[]};
    siapkanSaringanKoreksi(bulan);
    gambarKoreksiRiwayat();
    return;
  }

  const U={},trip={},bawa={};
  unitUnik().forEach(u=>U[u.kode]={nama:u.nama,zona:u.zona,ent:u.entitas,
    omset:0,deposit:0,collect:0,isi:0,kosong:0,rupiahHari:0,lag:0,lagN:0});
  (DATA.lain||[]).filter(x=>x.tgl.slice(0,7)===bulan).forEach(x=>{
    const p=U[x.unit]; if(!p)return;
    p.deposit+=x.nilai;
    if(x.totalCollect){p.collect+=x.totalCollect;
      bawa[x.tglCollect]=(bawa[x.tglCollect]||0)+x.totalCollect;}
    if(x.tglCollect)trip[x.tglCollect+"|"+p.zona]=p.zona;
  });
  rows.forEach(r=>{
    const p=U[r.unit]; if(!p)return;
    if(kosong(r))p.kosong++; else {p.isi++;p.omset+=total(r);}
    const n=+r.totalCollect||0;
    if(n){p.collect+=n;bawa[r.tglCollect]=(bawa[r.tglCollect]||0)+n;}
    if(r.tglCollect){
      trip[r.tglCollect+"|"+p.zona]=p.zona;
      const h=beda(r.tgl,r.tglCollect);
      if(!kosong(r)&&h>=0){p.rupiahHari+=total(r)*h;p.lag+=h;p.lagN++;}
    }
  });
  /* Per hari collect, kelompokkan unit yang dijemput lalu hitung biayanya. */
  const perHari={};
  Object.keys(trip).forEach(k=>{const [t,zona]=k.split("|");(perHari[t]=perHari[t]||[]).push(zona);});
  const unitHari={};
  DATA.db.filter(r=>r.tgl.slice(0,7)===bulan&&r.tglCollect).forEach(r=>{
    (unitHari[r.tglCollect]=unitHari[r.tglCollect]||new Set()).add(r.unit);});
  (DATA.lain||[]).filter(x=>x.tgl.slice(0,7)===bulan&&x.tglCollect).forEach(x=>{
    (unitHari[x.tglCollect]=unitHari[x.tglCollect]||new Set()).add(x.unit);});
  let transport=0; const tz={};
  const peta={}; unitUnik().forEach(u=>peta[u.kode]=u);
  Object.keys(unitHari).forEach(t=>{
    const us=[...unitHari[t]].map(k=>peta[k]).filter(Boolean);
    const b=biayaKelompok(us);
    transport+=b;
    const zs=[...new Set(us.filter(u=>u.zona!=="KANTOR").map(u=>u.zona))];
    zs.forEach(z=>{tz[z]=(tz[z]||0)+biayaKelompok(us.filter(u=>u.zona===z));});
  });
  let puncak=0,puncakTgl="";
  Object.keys(bawa).forEach(t=>{if(bawa[t]>puncak){puncak=bawa[t];puncakTgl=t;}});

  const arr=Object.keys(U).map(k=>({kode:k,...U[k]})).filter(x=>x.isi||x.collect||x.deposit);
  const tOmset=arr.reduce((s,x)=>s+x.omset,0);
  const tDeposit=arr.reduce((s,x)=>s+x.deposit,0);
  const tCollect=arr.reduce((s,x)=>s+x.collect,0);
  const tRupiahHari=arr.reduce((s,x)=>s+x.rupiahHari,0);

  const aoaRingkas=[["Keterangan","Nilai"],
    ["Bulan",bulan],["Omset cash",tOmset],["Deposit dan lainnya",tDeposit],["Ter-collect",tCollect],
    ["Estimasi transport",transport],
    ["Rasio transport persen",tOmset?+(transport/tOmset*100).toFixed(4):0],
    ["Jumlah trip",Object.keys(trip).length],
    ["Puncak uang dibawa sehari",puncak],["Tanggal puncak",puncakTgl],
    ["Rupiah-hari mengendap",Math.round(tRupiahHari)]];
  const aoaUnit=[["Unit","Nama","Entitas","Zona","Omset","Deposit","Ter-collect","Selisih",
                  "Hari isi","Hari kosong","Kelengkapan persen","Aging rata-rata hari","Rupiah-hari"]];
  const aoaKel=[["Jenis","Kelompok","Omset","Deposit","Ter-collect","Estimasi transport","Rasio transport persen"]];

  let h='<div class="angka" style="margin-top:0;border-top:1px solid var(--rule)">'+
    kartu("Omset cash",mio(tOmset))+
    kartu("Deposit & lainnya",mio(tDeposit))+
    kartu("Estimasi transport",rb(transport))+
    kartu("Rasio transport",(tOmset?(transport/tOmset*100).toFixed(2):"0")+"%")+
    kartu("Trip",Object.keys(trip).length)+'</div>';

  h+='<div class="blok"><div class="judul"><h2>Eksposur Kas</h2></div>'+
     '<p class="ket">Puncak sehari <b class="num">'+mio(puncak)+'</b>'+
     (puncakTgl?" pada "+tglTeks(puncakTgl):"")+' · mengendap <b class="num">'+
     new Intl.NumberFormat("en-US").format(Math.round(tRupiahHari/1e6))+
     '</b> juta rupiah-hari</p></div>';

  h+=blokStatusVerif(bulan);
  h+=tabelKelompok("Per Entitas",kelompok(arr,x=>x.ent),tz,aoaKel,"Entitas");
  h+=tabelKelompok("Per Zona",kelompok(arr,x=>x.zona),tz,aoaKel,"Zona");

  h+='<div class="blok"><div class="judul"><h2>Per Unit</h2>'+
     '<button class="halus" onclick="salin(ANALISA.unit,this)">Salin</button></div><div class="gulir"><table>'+
     '<thead><tr><th>Unit</th><th>Entitas</th><th>Zona</th><th class="kanan">Omset</th>'+
     '<th class="kanan">Ter-collect</th><th class="kanan">Selisih</th><th class="kanan">Hari isi</th>'+
     '<th class="kanan">Hari kosong</th><th class="kanan">Kelengkapan</th>'+
     '<th class="kanan">Aging rata²</th></tr></thead><tbody>';
  arr.sort((a,b)=>b.omset-a.omset).forEach(x=>{
    const sel=x.collect-(x.omset+x.deposit), lengkap=x.isi+x.kosong?Math.round(x.isi/(x.isi+x.kosong)*100):0;
    aoaUnit.push([x.kode,x.nama,x.ent,x.zona,x.omset,x.deposit,x.collect,sel,x.isi,x.kosong,lengkap,
                  x.lagN?+(x.lag/x.lagN).toFixed(2):"",Math.round(x.rupiahHari)]);
    h+='<tr><td><b>'+x.kode+'</b></td><td>'+x.ent+'</td><td>'+x.zona+'</td>'+
       '<td class="kanan num">'+rp(x.omset)+'</td>'+
       '<td class="kanan num">'+rp(x.deposit)+'</td>'+
       '<td class="kanan num">'+rp(x.collect)+'</td>'+
       '<td class="kanan num" style="color:'+(sel<0?"var(--stamp)":(sel>0?"var(--amber)":"var(--ink3)"))+'">'+
         (sel>0?"+":"")+rp(sel)+'</td>'+
       '<td class="kanan num">'+x.isi+'</td><td class="kanan num">'+x.kosong+'</td>'+
       '<td class="kanan num" style="color:'+(lengkap<80?"var(--stamp)":"inherit")+'">'+lengkap+'%</td>'+
       '<td class="kanan num">'+(x.lagN?(x.lag/x.lagN).toFixed(1):"—")+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="bar"><button class="aksi" onclick="unduhAnalisaXLSX()">Download Excel</button>'+
     '<button class="halus" onclick="unduhAnalisaCSV()">Download CSV</button>'+
     '<button class="halus" onclick="salin(ANALISA.semua,this)">Salin Semua</button>'+
     '<span class="pesan" id="pesanAnalisa"></span></div>';
  h+='<div id="riwayatKoreksi"></div>';
  box.innerHTML=h;
  siapkanSaringanKoreksi(bulan);
  gambarKoreksiRiwayat();
  ANALISA={bulan:bulan,ringkas:aoaRingkas,unit:aoaUnit,
           entitas:aoaKel.filter(r=>r[0]==="Jenis"||r[0]==="Entitas"),
           zona:aoaKel.filter(r=>r[0]==="Jenis"||r[0]==="Zona"),
           kelompok:aoaKel,
           koreksi:[["Waktu","Jenis","Unit","Tgl collect","Tgl omset","Nilai lama","Nilai baru",
                     "Selisih","Sudah setor","Oleh","Alasan"]],
           semua:[].concat([["RINGKASAN"]],aoaRingkas,[[]],[["PER KELOMPOK"]],aoaKel,
                           [[]],[["PER UNIT"]],aoaUnit)};
  gambarKoreksiRiwayat();
}
function siapkanSaringanKoreksi(bulan){
  const su=document.getElementById("kUnit");
  if(su&&!su.dataset.siap){
    su.innerHTML='<option value="">Semua unit</option>'+
      unitUnik().map(u=>'<option value="'+u.kode+'">'+u.kode+'</option>').join("");
    su.dataset.siap="1";
  }
  const d1=document.getElementById("kDari"), d2=document.getElementById("kSampai");
  if(d1&&!d1.value) d1.value=bulan+"-01";
  if(d2&&!d2.value){
    const [y,m]=bulan.split("-").map(Number);
    d2.value=bulan+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0");
  }
}
function gambarKoreksiRiwayat(){
  const box=document.getElementById("riwayatKoreksi");
  if(!box)return;
  const unit=(document.getElementById("kUnit")||{}).value||"";
  const d1=(document.getElementById("kDari")||{}).value||"";
  const d2=(document.getElementById("kSampai")||{}).value||"";
  const jns=(document.getElementById("kJenis")||{}).value||"KOREKSI";
  const r=(DATA.koreksi||[]).filter(x=>
    (!unit||x.unit===unit) && (!d1||x.waktu>=d1) && (!d2||x.waktu<=d2) &&
    (jns==="SEMUA"||String(x.jns||"KOREKSI")===jns))
    .sort((a,b)=>b.waktu.localeCompare(a.waktu));
  let h='<div class="blok"><div class="judul"><h2>Koreksi Setoran</h2>'+
    (r.length?'<button class="halus" onclick="salin(ANALISA.koreksi,this)">Salin</button>':'')+
    '</div>';
  if(!r.length){
    ANALISA&&(ANALISA.koreksi=[["Waktu","Jenis","Unit","Tgl collect","Tgl omset","Nilai lama","Nilai baru","Selisih","Sudah setor","Oleh","Alasan"]]);
    return void(box.innerHTML=h+'<div class="kosongan">Tidak ada koreksi pada saringan ini.</div></div>');
  }
  const aoa=[["Waktu","Jenis","Unit","Tgl collect","Tgl omset","Nilai lama","Nilai baru","Selisih",
              "Sudah setor","Oleh","Alasan"]];
  h+='<div class="gulir"><table><thead><tr><th>Waktu</th><th>Jenis</th><th>Unit</th>'+
     '<th>Tgl collect</th><th>Tgl omset</th><th class="kanan">Lama</th><th class="kanan">Baru</th>'+
     '<th class="kanan">Selisih</th><th>Alasan</th><th>Oleh</th></tr></thead><tbody>';
  let naik=0,turun=0;
  /* Baris tanggal setor dan pembukaan verifikasi tidak memindahkan rupiah,
     jadi kolom nilainya dibiarkan apa adanya dan tidak ikut direkap. */
  const angkaBaris=x=>String(x.jns||"KOREKSI")==="KOREKSI"||String(x.jns)==="HARI SAMA";
  r.forEach(x=>{
    const ang=angkaBaris(x);
    if(ang){if(x.selisih<0)turun+=x.selisih; else naik+=x.selisih;}
    aoa.push([x.waktu,x.jns||"KOREKSI",x.unit,x.tglCollect,x.tglOmset,x.lama,x.baru,
              ang?x.selisih:"",x.sudahSetor?"Ya":"Tidak",x.oleh,x.alasan]);
    h+='<tr><td>'+tglTeks(x.waktu)+'</td><td class="rinci">'+(x.jns||"KOREKSI")+'</td>'+
       '<td><b>'+x.unit+'</b></td>'+
       '<td>'+tglTeks(x.tglCollect)+'</td><td>'+tglTeks(x.tglOmset)+'</td>'+
       '<td class="kanan num">'+(ang?rp(x.lama):(x.lama?tglTeks(x.lama):"—"))+'</td>'+
       '<td class="kanan num">'+(ang?rp(x.baru):(x.baru?tglTeks(x.baru):"—"))+'</td>'+
       '<td class="kanan num" style="color:'+(x.selisih<0?"var(--stamp)":"var(--amber)")+'">'+
         (ang?((x.selisih>0?"+":"")+rp(x.selisih)):"")+'</td>'+
       '<td class="rinci">'+x.alasan+(x.sudahSetor?' <b>· sudah disetor</b>':'')+'</td>'+
       '<td class="rinci">'+x.oleh+'</td></tr>';
  });
  h+='</tbody></table></div><p class="catatan">'+r.length+' baris · +'+rp(naik)+
     ' / \u2212'+rp(Math.abs(turun))+'</p></div>';
  box.innerHTML=h;
  if(ANALISA)ANALISA.koreksi=aoa;
}
/* Status verifikasi IA atas omset yang sudah ter-collect. Dikumpulkan
   per unit, dengan daftar yang masih menggantung di bawahnya. */
let AOA_VERIF=[["Unit","Entitas","Collect","Terverifikasi","Belum","Nilai belum",
                "Jeda setor rata-rata hari","Menunggu terlama hari"]];
function blokStatusVerif(bulan){
  const A=acuan();
  const BV=+DATA.config.BATAS_VERIF_HARI||3;
  const BS=+DATA.config.BATAS_SETOR_HARI||1;
  const peta={}; unitUnik().forEach(u=>peta[u.kode]=u);
  const ev=peristiwaVerif().filter(x=>(x.tglSetor||x.tglCollect).slice(0,7)===bulan);
  AOA_VERIF=[["Unit","Entitas","Collect","Terverifikasi","Belum","Nilai belum",
              "Jeda setor rata-rata hari","Menunggu terlama hari"]];
  if(!ev.length)
    return '<div class="blok"><div class="judul"><h2>Status Verifikasi</h2></div>'+
           '<div class="kosongan">Belum ada collect di bulan itu.</div></div>';

  const U={};
  let nVerif=0,nilaiBelum=0,tunggu=0,jedaTotal=0,jedaN=0,lambat=0;
  ev.forEach(x=>{
    const u=peta[x.unit]; if(!u)return;
    const nilai=x.terima+x.terimaLain;
    U[x.unit]=U[x.unit]||{ent:u.entitas,n:0,v:0,belum:0,nilai:0,jeda:0,jedaN:0,tunggu:0};
    const p=U[x.unit];
    p.n++; p.nilai+= x.verifOleh?0:nilai;
    if(x.verifOleh){p.v++;nVerif++;}
    else{
      p.belum++; nilaiBelum+=nilai;
      const t=beda(x.tglCollect,A);
      if(t>p.tunggu)p.tunggu=t;
      if(t>tunggu)tunggu=t;
    }
    if(x.tglSetor){
      const j=beda(x.tglCollect,x.tglSetor);
      p.jeda+=j; p.jedaN++; jedaTotal+=j; jedaN++;
      if(j>BS)lambat++;
    }
  });

  let h='<div class="angka" style="margin-top:26px;border-top:1px solid var(--rule)">'+
    kartu("Collect bulan ini",ev.length)+
    kartu("Terverifikasi",nVerif+" / "+ev.length)+
    kartu("Nilai belum verif",mio(nilaiBelum))+
    kartu("Menunggu terlama",tunggu?tunggu+" hari":"—")+
    kartu("Setor lewat H+"+BS,lambat)+'</div>';

  h+='<div class="blok"><div class="judul"><h2>Status Verifikasi</h2>'+
     '<button class="halus" onclick="salin(AOA_VERIF,this)">Salin</button></div>'+
     '<div class="gulir"><table><thead><tr><th>Unit</th><th>Entitas</th>'+
     '<th class="kanan">Collect</th><th class="kanan">Terverifikasi</th>'+
     '<th class="kanan">Belum</th><th class="kanan">Nilai belum</th>'+
     '<th class="kanan">Jeda setor</th><th class="kanan">Menunggu terlama</th>'+
     '</tr></thead><tbody>';
  Object.keys(U).sort((a,b)=>U[b].nilai-U[a].nilai).forEach(k=>{
    const p=U[k];
    const jeda=p.jedaN?(p.jeda/p.jedaN):null;
    AOA_VERIF.push([k,p.ent,p.n,p.v,p.belum,p.nilai,
                    jeda===null?"":+jeda.toFixed(2),p.tunggu]);
    h+='<tr><td><b>'+k+'</b></td><td>'+p.ent+'</td>'+
       '<td class="kanan num">'+p.n+'</td>'+
       '<td class="kanan num">'+p.v+'</td>'+
       '<td class="kanan num" style="color:'+(p.belum?"var(--stamp)":"inherit")+'">'+p.belum+'</td>'+
       '<td class="kanan num">'+(p.nilai?rp(p.nilai):"—")+'</td>'+
       '<td class="kanan num" style="color:'+(jeda!==null&&jeda>BS?"var(--amber)":"inherit")+'">'+
         (jeda===null?"—":jeda.toFixed(1))+'</td>'+
       '<td class="kanan num" style="color:'+(p.tunggu>BV?"var(--stamp)":"inherit")+'">'+
         (p.tunggu||"—")+'</td></tr>';
  });
  h+='</tbody></table></div>';

  const gantung=ev.filter(x=>!x.verifOleh)
    .sort((a,b)=>a.tglCollect.localeCompare(b.tglCollect));
  if(gantung.length){
    h+='<div class="gulir" style="margin-top:14px"><table><thead><tr>'+
       '<th>Unit</th><th>Jemput</th><th>Setor</th><th class="kanan">Nilai</th>'+
       '<th class="kanan">Menunggu</th></tr></thead><tbody>';
    gantung.slice(0,25).forEach(x=>{
      const t=beda(x.tglCollect,A);
      h+='<tr><td><b>'+x.unit+'</b></td><td>'+tglTeks(x.tglCollect)+'</td>'+
         '<td>'+(x.tglSetor?tglTeks(x.tglSetor):"—")+'</td>'+
         '<td class="kanan num">'+rp(x.terima+x.terimaLain)+'</td>'+
         '<td class="kanan num" style="color:'+(t>BV?"var(--stamp)":"inherit")+'">'+t+' hari</td></tr>';
    });
    h+='</tbody></table></div>';
    if(gantung.length>25)h+='<p class="catatan">'+gantung.length+' menggantung, 25 terlama ditampilkan.</p>';
  }
  return h+'</div>';
}
function kartu(l,v){return '<div><div class="lbl">'+l+'</div><div class="val num">'+v+'</div></div>';}
function kelompok(arr,fn){
  const m={};
  arr.forEach(x=>{const k=fn(x);m[k]=m[k]||{omset:0,collect:0,zona:new Set()};
    m[k].omset+=x.omset;m[k].deposit=(m[k].deposit||0)+x.deposit;
    m[k].collect+=x.collect;m[k].zona.add(x.zona);});
  return m;
}
function tabelKelompok(judul,m,tz,aoa,jenis){
  let h='<div class="blok"><div class="judul"><h2>'+judul+'</h2>'+
    '<button class="halus" onclick="salin(ANALISA.'+(jenis==="Entitas"?"entitas":"zona")+',this)">Salin</button>'+
    '</div><div class="gulir"><table>'+
    '<thead><tr><th>Kelompok</th><th class="kanan">Omset</th><th class="kanan">Deposit</th>'+
    '<th class="kanan">Ter-collect</th>'+
    '<th class="kanan">Estimasi transport</th><th class="kanan">Rasio transport</th></tr></thead><tbody>';
  Object.keys(m).sort((a,b)=>m[b].omset-m[a].omset).forEach(k=>{
    let tr=0; m[k].zona.forEach(z=>{tr+=tz[z]||0;});
    const rasio=m[k].omset?(tr/m[k].omset*100):0;
    aoa.push([jenis,k,m[k].omset,m[k].deposit||0,m[k].collect,tr,+rasio.toFixed(4)]);
    h+='<tr><td><b>'+k+'</b></td><td class="kanan num">'+rp(m[k].omset)+'</td>'+
       '<td class="kanan num">'+rp(m[k].deposit||0)+'</td>'+
       '<td class="kanan num">'+rp(m[k].collect)+'</td>'+
       '<td class="kanan num">'+rp(tr)+'</td>'+
       '<td class="kanan num" style="color:'+(rasio>2?"var(--stamp)":"inherit")+'">'+rasio.toFixed(2)+'%</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function unduhAnalisaXLSX(){
  if(!ANALISA)return;
  unduhXLSX("ANALISA_"+ANALISA.bulan+".xlsx",[
    {nama:"Ringkasan",aoa:ANALISA.ringkas},
    {nama:"Per kelompok",aoa:ANALISA.kelompok},
    {nama:"Per unit",aoa:ANALISA.unit},
    {nama:"Verifikasi",aoa:AOA_VERIF},
    {nama:"Koreksi",aoa:ANALISA.koreksi}]);
  const p=document.getElementById("pesanAnalisa");
  if(p){p.className="pesan";p.textContent="Berkas Excel dibuat.";}
}
function unduhAnalisaCSV(){
  if(!ANALISA)return;
  unduhTeks("ANALISA_"+ANALISA.bulan+"_per_unit.csv",keCSV(ANALISA.unit),"text/csv");
  const p=document.getElementById("pesanAnalisa");
  if(p){p.className="pesan";p.textContent="Berkas CSV dibuat.";}
}

/* Menarik data terbaru tanpa memuat ulang halaman, supaya perubahan
   dari perangkat lain ikut terlihat. Isian yang belum disimpan akan
   tertimpa, jadi ditanyakan dulu. */
async function muatUlang(btn){
  if(KOTOR&&!confirm("Ada isian yang belum disimpan dan akan hilang. Lanjutkan?"))return;
  if(Object.keys(LAIN_BARU).some(k=>(LAIN_BARU[k]||[]).length)&&
     !confirm("Ada penerimaan di luar omset yang belum disimpan. Lanjutkan?"))return;
  const semula=btn.textContent;
  btn.textContent="Memuat…"; btn.disabled=true;
  try{
    if(adaServer){
      const baru=await panggil("muatData");
      DATA=baru;
      DATA.lain=DATA.lain||[]; DATA.jenis=DATA.jenis||[]; DATA.koreksi=DATA.koreksi||[];
      bersihkanGanda();
    }
    LAIN_BARU={}; unitTambahan=[]; KOTOR=false;
    gambarPosisi();
    const tampil=id=>!document.getElementById(id).hidden;
    if(tampil("panOmset"))gambarOmset();
    if(tampil("panCollect"))gambarCollect();
    if(tampil("panExport"))gambarExport();
    if(tampil("panVerifikasi"))gambarVerifikasi();
    if(tampil("panAnalisa"))gambarAnalisa();
    btn.textContent="Data terbaru";
  }catch(e){
    btn.textContent="Gagal memuat";
  }
  setTimeout(()=>{btn.textContent=semula;btn.disabled=false;},2200);
}

/* ================= RANGKA ================= */
function diagnosa(){
  const wadah=document.getElementById("daftar");
  if(!wadah)return;
  const nUnit=(DATA.master||[]).length, nDb=(DATA.db||[]).length;
  if(nUnit&&nDb)return;
  const peran=(DATA.aku&&DATA.aku.peran)||"tidak terbaca";
  let sebab;
  if(!nUnit)
    sebab="Tidak ada unit yang terbaca. Periksa daftar akses: kolom PERAN untuk akun ini "+
          "terbaca <b>"+peran+"</b>, dan kolom UNIT membatasi unit mana yang boleh dilihat. "+
          "Kosongkan kolom UNIT untuk melihat semuanya. Periksa juga kolom AKTIF di daftar unit.";
  else
    sebab="Ada "+nUnit+" baris unit, tetapi tidak ada satu pun baris omset yang terbaca.";
  wadah.innerHTML='<div class="blok"><div class="judul"><h2>Data tidak terbaca</h2></div>'+
    '<p class="ket">'+sebab+'</p></div>';
}
function pilihTab(n){
  const map={posisi:"Posisi",omset:"Omset",collect:"Collect",export:"Export",
             verifikasi:"Verifikasi",analisa:"Analisa"};
  Object.keys(map).forEach(x=>{
    document.getElementById("pan"+map[x]).hidden=(x!==n);
    document.getElementById("tab"+map[x]).setAttribute("aria-selected",x===n);});
  if(n==="omset")gambarOmset();
  if(n==="collect")gambarCollect();
  if(n==="export"){isiPeriode();gambarExport();}
  if(n==="verifikasi")gambarVerifikasi();
  if(n==="analisa")gambarAnalisa();
}
function mulai(){
  const hari=hariIni();
  ["tglAcuan"].forEach(id=>{const e=document.getElementById(id); if(e&&!e.value)e.value=hari;});
  ["eBulan","aBulan"].forEach(id=>{const e=document.getElementById(id); if(e&&!e.value)e.value=hari.slice(0,7);});
  const adm=DATA.aku&&DATA.aku.peran==="ADMIN";
  const ia=DATA.aku&&DATA.aku.peran==="IA";
  document.getElementById("tabAnalisa").hidden=!adm;
  document.getElementById("tabVerifikasi").hidden=!(adm||ia);
  const A=acuan();
  document.getElementById("oDari").value=A;
  document.getElementById("oSampai").value=A;
  document.getElementById("cCollect").value=A;
  isiUnitOmset();
  document.getElementById("eUnit").innerHTML=
    unitUnik().map(u=>'<option value="'+u.kode+'">'+u.kode+" — "+u.nama+'</option>').join("");
  gambarPosisi();
}
document.getElementById("tglAcuan").addEventListener("change",()=>{
  document.getElementById("oDari").value=acuan();
  document.getElementById("oSampai").value=acuan();
  document.getElementById("cCollect").value=acuan();
  gambarPosisi();
  if(!document.getElementById("panOmset").hidden)gambarOmset();
  if(!document.getElementById("panCollect").hidden)gambarCollect();
});
muat();
</script>
